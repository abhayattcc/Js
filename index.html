    <script>
/* ── BOOTSTRAP: cache all JS/WASM libs in IndexedDB, inject as blobs ── */
(function(){
  const IDB_NAME='gk-app-store', IDB_STORE='files';
  const LIBS=[
    {key:'asset:pako:2.0.4',         url:'https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js',            type:'js'},
    {key:'asset:sqljs:1.8.0',        url:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.min.js',      type:'js'},
    {key:'asset:sqlwasm:1.8.0',      url:'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.wasm',        type:'wasm'},
    {key:'asset:pdfjs:2.14.305',     url:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js',        type:'js'},
    {key:'asset:pdfjsw:2.14.305',    url:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js', type:'worker'}
  ];
  function openIDB(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open(IDB_NAME,1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
      r.onsuccess=e=>res(e.target.result); r.onerror=()=>rej(r.error);
    });
  }
  function iget(db,k){return new Promise((res,rej)=>{const r=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
  function iput(db,k,v){return new Promise((res,rej)=>{const r=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
  function injectJS(buf){const s=document.createElement('script');s.textContent=new TextDecoder().decode(buf);document.head.appendChild(s);}
  async function boot(){
    const db=await openIDB();
    for(const lib of LIBS){
      let buf=await iget(db,lib.key);
      if(!buf){const r=await fetch(lib.url);buf=await r.arrayBuffer();await iput(db,lib.key,buf);}
      if(lib.type==='js') injectJS(buf);
      else if(lib.type==='wasm') window._sqlWasmBlobUrl=URL.createObjectURL(new Blob([buf],{type:'application/wasm'}));
      else if(lib.type==='worker') window._pdfWorkerBlobUrl=URL.createObjectURL(new Blob([buf],{type:'application/javascript'}));
    }
    window._assetsReady=true;
    document.dispatchEvent(new Event('assets-ready'));
  }
  window._assetsBootstrap=boot();
})();
    </script>

/* ══════════════════════════════════════════════════════════════════════════
   TTS BRIDGE — uses AndroidTTS Java bridge when inside the Android app,
   falls back to Web Speech API in browsers.
   
   AndroidTTS Java interface (from MainActivity):
     AndroidTTS.speak(text, lang, utteranceId)   — queues speech
     AndroidTTS.stop()                            — cancels all speech
     AndroidTTS.isSpeaking()                      — returns boolean
   
   Java calls back via:
     window._attsOnEnd(utteranceId)               — called when utterance finishes
   ══════════════════════════════════════════════════════════════════════════ */
const TTS = (function(){
    const isAndroid = () => !!window.AndroidTTS;

    // Callback registry: utteranceId → function()
    const _endCallbacks = {};
    let _utteranceCounter = 0;

    // Called by Java (TtsProgressListener.onDone / onError)
    window._attsOnEnd = function(id) {
        if (_endCallbacks[id]) {
            const cb = _endCallbacks[id];
            delete _endCallbacks[id];
            cb();
        }
    };

    function _nextId() {
        return 'utt_' + (++_utteranceCounter) + '_' + Date.now();
    }

    // Detect language for a text chunk: 'or' | 'hi' | 'en'
    function _detectLang(text) {
        if (/[଀-୿]/.test(text)) return 'or';
        if (/[ऀ-ॿ]/.test(text)) return 'hi';
        return 'en';
    }

    /* speak(text, lang, onEnd)
       lang: 'or' | 'hi' | 'en' | null (auto-detect)
       onEnd: optional callback fired when this utterance finishes        */
    function speak(text, lang, onEnd) {
        if (!text || !text.trim()) { if (onEnd) onEnd(); return; }
        lang = lang || _detectLang(text);

        if (isAndroid()) {
            const id = _nextId();
            if (onEnd) _endCallbacks[id] = onEnd;
            else _endCallbacks[id] = function(){};
            window.AndroidTTS.speak(text.trim(), lang, id);
        } else {
            // Web Speech API fallback
            if (!window.speechSynthesis) { if (onEnd) onEnd(); return; }
            const u = new SpeechSynthesisUtterance(text);
            const voiceMap = { or: defaultOdiaVoice, hi: defaultHindiVoice, en: defaultEnglishVoice };
            const v = voiceMap[lang];
            if (v) { u.voice = v; u.lang = v.lang; }
            u.rate = 0.75; u.pitch = 1.0; u.volume = 1.0;
            if (onEnd) u.onend = onEnd;
            window.speechSynthesis.speak(u);
            speechUtterances.push(u);
        }
    }

    /* speakMultiLang(text, onAllDone)
       Splits text by script, speaks each chunk in its own language,
       chains them serially, then calls onAllDone.                        */
    function speakMultiLang(text, onAllDone) {
        if (!text || !text.trim()) { if (onAllDone) onAllDone(); return; }

        // Build ordered list of {chunk, lang} segments
        const segments = [];
        // Split on script boundaries: Odia, Devanagari, Latin
        const re = /[଀-୿]+|[ऀ-ॿ]+|[A-Za-z0-9][A-Za-z0-9 ,.\-!?;:'"()]*/g;
        let m;
        while ((m = re.exec(text)) !== null) {
            const chunk = m[0].trim();
            if (!chunk) continue;
            const lang = _detectLang(chunk);
            // Merge consecutive same-lang segments
            if (segments.length > 0 && segments[segments.length-1].lang === lang) {
                segments[segments.length-1].chunk += ' ' + chunk;
            } else {
                segments.push({ chunk, lang });
            }
        }

        if (segments.length === 0) { if (onAllDone) onAllDone(); return; }

        // Chain: speak each segment, then next, then onAllDone
        function speakNext(i) {
            if (!isReadingAloud && i > 0) return; // stopped
            if (i >= segments.length) { if (onAllDone) setTimeout(onAllDone, 300); return; }
            const seg = segments[i];
            speak(seg.chunk, seg.lang, () => {
                if (isReadingAloud || i === 0) speakNext(i + 1);
            });
        }
        speakNext(0);
    }

    function stop() {
        if (isAndroid()) {
            window.AndroidTTS.stop();
            // Clear all pending callbacks
            Object.keys(_endCallbacks).forEach(k => delete _endCallbacks[k]);
        } else {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        }
        speechUtterances = [];
        activeUtterances = 0;
    }

    function isSpeaking() {
        if (isAndroid()) return window.AndroidTTS.isSpeaking();
        return window.speechSynthesis && window.speechSynthesis.speaking;
    }

    function pause() {
        if (!isAndroid() && window.speechSynthesis) window.speechSynthesis.pause();
        // Android TTS has no pause — we just stop and resume from index
    }

    function resume() {
        if (!isAndroid() && window.speechSynthesis) window.speechSynthesis.resume();
    }

    function isAndroidMode() { return isAndroid(); }

    return { speak, speakMultiLang, stop, isSpeaking, pause, resume, isAndroidMode };
})();

function isMindMapHtml(htmlString) {
    // Detect if the HTML looks like a nested UL mind map (heading + ul>li structure)
    const div = document.createElement('div');
    div.innerHTML = htmlString;
    const heading = div.querySelector('h1, h2, h3');
    const ul = div.querySelector('ul');
    const li = ul && ul.querySelector('li');
    return !!(heading && ul && li);
}

function buildMindMap(container, htmlString) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlString;

    const wrapper = document.createElement('div');
    wrapper.className = 'mindmap-container';

    // Title
    const h1 = tempDiv.querySelector('h1, h2, h3');
    if (h1) {
        const title = document.createElement('h1');
        title.textContent = h1.textContent;
        wrapper.appendChild(title);
    }

    // Collapse All / Expand All controls
    const ctrlBar = document.createElement('div');
    ctrlBar.style.cssText = 'text-align:center;margin-bottom:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;';
    const collapseAllBtn = document.createElement('button');
    collapseAllBtn.textContent = '⊟ Collapse All';
    collapseAllBtn.style.cssText = 'padding:8px 18px;border-radius:30px;border:none;background:linear-gradient(135deg,#e91e63,#c2185b);color:#fff;font-weight:bold;cursor:pointer;font-size:14px;font-family:inherit;';
    const expandAllBtn = document.createElement('button');
    expandAllBtn.textContent = '⊞ Expand All';
    expandAllBtn.style.cssText = 'padding:8px 18px;border-radius:30px;border:none;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;font-weight:bold;cursor:pointer;font-size:14px;font-family:inherit;';
    ctrlBar.appendChild(collapseAllBtn);
    ctrlBar.appendChild(expandAllBtn);
    wrapper.appendChild(ctrlBar);

    // Build root UL — works for both full-doc and fragment HTML
    const rootUl = tempDiv.querySelector('body > ul') || tempDiv.querySelector(':scope > ul') || tempDiv.querySelector('ul');
    if (rootUl) {
        const mmRoot = document.createElement('ul');
        mmRoot.className = 'mindmap-root';
        buildMMLevel(rootUl, mmRoot, 0);
        wrapper.appendChild(mmRoot);
    }

    container.appendChild(wrapper);

    // Collapse All
    collapseAllBtn.addEventListener('click', () => {
        wrapper.querySelectorAll('.mindmap-children').forEach(c => c.classList.add('hidden-children'));
        wrapper.querySelectorAll('.mindmap-toggle').forEach(t => t.classList.add('collapsed'));
    });
    // Expand All
    expandAllBtn.addEventListener('click', () => {
        wrapper.querySelectorAll('.mindmap-children').forEach(c => c.classList.remove('hidden-children'));
        wrapper.querySelectorAll('.mindmap-toggle').forEach(t => t.classList.remove('collapsed'));
    });
}

function buildMMLevel(srcUl, destUl, level) {
    Array.from(srcUl.children).forEach(li => {
        if (li.tagName !== 'LI') return;

        const nodeDiv = document.createElement('li');
        nodeDiv.className = `mindmap-node mm-level-${Math.min(level, 5)}`;

        // Get the <p> text (node label), or fallback to direct text node
        const pEl = li.querySelector(':scope > p');
        let label = '';
        if (pEl) {
            label = pEl.textContent.trim();
        } else {
            // Collect direct text nodes (ignore child element text)
            label = Array.from(li.childNodes)
                .filter(n => n.nodeType === 3)
                .map(n => n.textContent.trim())
                .join(' ')
                .trim();
            // If still empty, try first inline element (span, strong, em, a)
            if (!label) {
                const inline = li.querySelector(':scope > span, :scope > strong, :scope > em, :scope > a');
                if (inline) label = inline.textContent.trim();
            }
        }

        // Get <pre> notes — handle both <pre>text</pre> and <pre><p>text</p></pre>
        const preEls = Array.from(li.querySelectorAll(':scope > pre'));
        function extractNoteText(pre) {
            // If pre contains <p> tags, join their text with newlines
            const pTags = pre.querySelectorAll('p');
            if (pTags.length > 0) {
                return Array.from(pTags)
                    .map(p => p.textContent.replace(/\u00A0/g, ' ').trim())
                    .filter(t => t.length > 0)
                    .join('\n');
            }
            return pre.textContent.replace(/\u00A0/g, ' ').trim();
        }

        // Get child <ul>
        const childUl = li.querySelector(':scope > ul');

        if (childUl) {
            // Togglable node
            const btn = document.createElement('button');
            btn.className = 'mindmap-toggle';
            const arrow = document.createElement('span');
            arrow.className = 'mm-arrow';
            arrow.textContent = '▾';
            btn.appendChild(arrow);
            btn.appendChild(document.createTextNode(' ' + label));
            nodeDiv.appendChild(btn);

            // Notes
            preEls.forEach(pre => {
                const noteText = extractNoteText(pre);
                if (!noteText) return;
                const note = document.createElement('div');
                note.className = 'mm-note';
                note.textContent = noteText;
                nodeDiv.appendChild(note);
            });

            // Children
            const childContainer = document.createElement('ul');
            childContainer.className = 'mindmap-children';
            buildMMLevel(childUl, childContainer, level + 1);
            nodeDiv.appendChild(childContainer);

            btn.addEventListener('click', () => {
                const isCollapsed = childContainer.classList.toggle('hidden-children');
                btn.classList.toggle('collapsed', isCollapsed);
            });
        } else {
            // Leaf node
            const leaf = document.createElement('span');
            leaf.className = 'mindmap-leaf';
            leaf.textContent = label;
            nodeDiv.appendChild(leaf);

            preEls.forEach(pre => {
                const noteText = extractNoteText(pre);
                if (!noteText) return;
                const note = document.createElement('div');
                note.className = 'mm-note';
                note.textContent = noteText;
                nodeDiv.appendChild(note);
            });
        }

        destUl.appendChild(nodeDiv);
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;

function filterTextByLanguage(text, lang) {
    if (typeof text !== 'string' || typeof lang !== 'string') return '';
    const patterns = { or:/[\u0B00-\u0B7F\,.":;!?()\0-9 ]+/g, hi:/[\u0900-\u097F]+/g, en:/[A-Za-z]+/g };
    const key = lang.toLowerCase().slice(0,2);
    if (!patterns[key]) return '';
    return (text.match(patterns[key]) || []).join(' ').trim();
}

/* ── Language-aware dictionary speak ────────────────────────────────────────
   Reads each .dict-field[data-lang] span in DOM order and speaks each one
   in its own language serially: English → Odia → Hindi, sentence by sentence.
   ─────────────────────────────────────────────────────────────────────────── */
function speakDictionaryResults(resultsEl, onDone) {
    // Collect all tagged fields in DOM order
    const fields = Array.from(resultsEl.querySelectorAll('.dict-field[data-lang]'));
    if (!fields.length) { if (onDone) onDone(); return; }

    // Build ordered segments: [{text, lang}, ...]
    const segments = [];
    fields.forEach(span => {
        const text = span.textContent.trim();
        const lang = span.getAttribute('data-lang'); // 'en' | 'or' | 'hi'
        if (text) segments.push({ text, lang });
    });

    if (!segments.length) { if (onDone) onDone(); return; }

    // Speak each segment serially, in its own language
    function speakNext(i) {
        if (i >= segments.length) { if (onDone) onDone(); return; }
        const { text, lang } = segments[i];
        TTS.speak(text, lang, () => speakNext(i + 1));
    }
    speakNext(0);
}

function getDictionaryTextToSpeak(el) {
    // Legacy fallback — plain text (used nowhere now but kept for safety)
    const t=document.createElement('div');
    el.querySelectorAll('.result-item').forEach(i=>{ const tx=i.querySelector('.result-text'); if(tx) t.appendChild(tx.cloneNode(true)); });

}
function mergeResults(results) {
    const merged=[],seen=new Map();
    results.forEach(r=>{ const k=(r.English||'').toLowerCase().trim(); if(!seen.has(k)){seen.set(k,r);merged.push(r);}else Object.assign(seen.get(k),r); });
    return merged;
}

/* ── IndexedDB Cache ── */
async function cacheFiles(){
    try{
        // Wait for JS/WASM bootstrap to finish first
        if(!window._assetsReady) await window._assetsBootstrap;

        // Inject Noto Sans font from IDB
        const db=await getIDB();
        let fontBuf=await idbGet(db,FONT_URL);
        if(!fontBuf){const r=await fetch(FONT_URL);if(r.ok){fontBuf=await r.arrayBuffer();await idbPut(db,FONT_URL,fontBuf);}}
        if(fontBuf){
            const blobUrl=URL.createObjectURL(new Blob([fontBuf],{type:'font/woff'}));
            const style=document.createElement('style');
            style.textContent=`@font-face{font-family:'Noto Sans';font-weight:bold;src:url('${blobUrl}') format('woff');}`;
            document.head.appendChild(style);
        }

        // Check which content files are missing
        const toFetch=[];
        for(const url of STATIC_ASSETS){
            if(url===FONT_URL) continue; // already handled above
            const existing=await idbGet(db,url);
            if(!existing) toFetch.push(url);
        }
        if(toFetch.length===0) return false; // all cached – no progress shown

        let loaded=0;
        for(const url of toFetch){
            try{
                const r=await fetch(url,{cache:'no-cache'});
                if(!r.ok) throw new Error();
                const buf=await r.arrayBuffer();
                await idbPut(db,url,buf);
                loaded++;
                showProgress('Downloading resources',Math.round((loaded/toFetch.length)*100));
            }catch(e){console.error('IDB cache err',url,e);}
        }
        hideProgress();
        return true;
    }catch(e){console.error(e);hideProgress();return false;}
}

async function loadResource(url){
    try{
        const db=await getIDB();
        const buf=await idbGet(db,url);
        if(buf) return new Response(buf);
        const r=await fetch(url,{cache:'no-cache'});
        if(!r.ok) throw new Error(`fetch failed ${url}`);
        const b=await r.arrayBuffer();
        await idbPut(db,url,b);
        return new Response(b.slice(0));
    }catch(e){
        console.error(e);
        document.getElementById('contentInner').innerHTML='<p>Offline: Resource not cached. Connect to internet first.</p>';
        return null;
    }
}

async function loadImage(url){
    try{
        const db=await getIDB();
        const buf=await idbGet(db,url);
        if(buf) return URL.createObjectURL(new Blob([buf]));
        const r=await fetch(url,{cache:'no-cache'});
        if(!r.ok) throw new Error();
        const b=await r.arrayBuffer();
        await idbPut(db,url,b);
        return URL.createObjectURL(new Blob([b]));
    }catch(e){return null;}
}

async function initDatabases(){
    try{
        if(!window._assetsReady) await window._assetsBootstrap;
        const SQL=await initSqlJs({locateFile:f=>{
            if(f.endsWith('.wasm')&&window._sqlWasmBlobUrl) return window._sqlWasmBlobUrl;
            return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f;
        }});
        const loadDB=async(url)=>{
            const r=await loadResource(url);
            if(!r) throw new Error();
            const buf=await r.arrayBuffer();
            return new SQL.Database(pako.ungzip(new Uint8Array(buf)));
        };
        dbEnglishOdia=await loadDB(dbFiles.english_odia);
        dbEnglishHindi=await loadDB(dbFiles.english_hindi);
    }catch(e){
        console.error('DB init error',e);
    }
}

async function searchWord(word, targetEl, suggestionsEl=null, isDictionary=false){
    const tw=trimInput(word);
    if(!tw){ targetEl.innerHTML=''; if(suggestionsEl) suggestionsEl.innerHTML=''; return; }
    let results=[],suggestions=[];
    const deletedImages=getDeletedImages();
    const customWords=JSON.parse(localStorage.getItem('customWords')||'[]');
    results.push(...customWords.filter(w=>w.English.toLowerCase()===tw||(w.odia&&w.odia.toLowerCase()===tw)||(w.hindi&&w.hindi.toLowerCase()===tw)));
    try{
        if(dbEnglishOdia){
            const s=dbEnglishOdia.prepare("SELECT English,odia FROM dictionary WHERE English LIKE ? OR odia LIKE ?");
            s.bind([tw,tw]); while(s.step()){ const r=s.getAsObject(); results.push({English:r.English,odia:r.odia}); } s.free();
        }
        if(dbEnglishHindi){
            const s=dbEnglishHindi.prepare("SELECT English,hindi,image FROM dictionary WHERE English LIKE ? OR hindi LIKE ?");
            s.bind([tw,tw]); while(s.step()){ const r=s.getAsObject(); results.push({English:r.English,hindi:r.hindi,image:r.image}); } s.free();
        }
        const merged=mergeResults(results);
        if(suggestionsEl){
            if(dbEnglishOdia){
                const s=dbEnglishOdia.prepare("SELECT English,odia FROM dictionary WHERE English LIKE ? OR odia LIKE ? LIMIT 5");
                s.bind([`${tw}%`,`${tw}%`]); while(s.step()){ const r=s.getAsObject(); suggestions.push({English:r.English,odia:r.odia}); } s.free();
            }
            if(dbEnglishHindi){
                const s=dbEnglishHindi.prepare("SELECT English,hindi,image FROM dictionary WHERE English LIKE ? OR hindi LIKE ? LIMIT 5");
                s.bind([`${tw}%`,`${tw}%`]); while(s.step()){ const r=s.getAsObject(); suggestions.push({English:r.English,hindi:r.hindi,image:r.image}); } s.free();
            }
            const ms=mergeResults(suggestions);
            suggestionsEl.innerHTML='<ul>'+ms.map(s=>`<li data-english="${escapeHtml(s.English||'')}" data-odia="${escapeHtml(s.odia||'')}" data-hindi="${escapeHtml(s.hindi||'')}">${escapeHtml(s.English||(s.odia||s.hindi))}</li>`).join('')+'</ul>';
        }
        let html='';
        merged.forEach(r=>{
            html+=`<div class="result-item"><div class="result-text">`;
            if(r.English) html+=`<strong>English:</strong> <span class="dict-field" data-lang="en">${escapeHtml(r.English)}</span><br>`;
            if(r.odia)    html+=`<strong>Odia:</strong> <span class="dict-field" data-lang="or">${escapeHtml(r.odia)}</span><br>`;
            if(r.hindi)   html+=`<strong>Hindi:</strong> <span class="dict-field" data-lang="hi">${escapeHtml(r.hindi)}</span><br>`;
            html+=`</div>`;
            if(r.image && !deletedImages.includes(r.image)){
                html+=`<div class="image-container">`;
                if(r.image.startsWith('data:')){ html+=`<img src="${r.image}" loading="lazy">`; }
                else{ loadImage(r.image).then(src=>{ if(src){ const el=targetEl.querySelector(`[data-image-placeholder="${r.image}"]`); if(el) el.src=src; } }); html+=`<img data-image-placeholder="${r.image}" src="" loading="lazy">`; }
                html+=`</div><div class="image-controls"><button class="delete-button" data-image="${r.image}" data-word="${escapeHtml(r.English||r.odia||r.hindi)}">Delete</button><button class="restore-button" data-image="${r.image}" data-word="${escapeHtml(r.English||r.odia||r.hindi)}" disabled>Restore</button></div>`;
            }
            html+=`</div>`;
        });
        targetEl.innerHTML=html;
        setupImageControlListeners(targetEl);
    }catch(e){
        console.error(e);
        targetEl.innerHTML='<div class="result-item"><div class="result-text">Error searching.</div></div>';
    }
}

function setupImageControlListeners(el){
    el.querySelectorAll('.delete-button').forEach(btn=>{
        btn.addEventListener('click',()=>{
            const u=btn.getAttribute('data-image');
            const ctrl=btn.closest('.image-controls');
            const cont=ctrl.previousElementSibling;
            saveDeletedImage(u);
            cont.querySelector('img')?.remove();
            let p=cont.querySelector('p'); if(!p){p=document.createElement('p');cont.appendChild(p);}
            p.textContent='Image hidden'; btn.textContent='Hidden'; btn.disabled=true;
            ctrl.querySelector('.restore-button').disabled=false;
        });
    });
    el.querySelectorAll('.restore-button').forEach(btn=>{
        btn.addEventListener('click',async()=>{
            const u=btn.getAttribute('data-image'),w=btn.getAttribute('data-word');
            const pwd=prompt('Enter the word to restore image:');
            if(pwd&&pwd.toLowerCase()===w.toLowerCase()){
                removeDeletedImage(u);
                const ctrl=btn.closest('.image-controls'),cont=ctrl.previousElementSibling;
                cont.querySelector('p')?.remove();
                const src=u.startsWith('data:')?u:await loadImage(u);
                if(src){ const img=document.createElement('img'); img.src=src; img.loading='lazy'; cont.appendChild(img); ctrl.querySelector('.restore-button').disabled=true; ctrl.querySelector('.delete-button').disabled=false; ctrl.querySelector('.delete-button').textContent='Delete'; }
                else alert('Image not available offline.');
            }else alert('Incorrect word.');
        });
    });
}

/* ── MCQ Parsing ── */
function parseChapterToSubjects(lines,lang,chapterName=''){
    const subjects=new Map(); let curSubj=null,curMcqs=[],i=0;
    const numRe=/^[0-9\u0B66-\u0B6F]+\.\s*/,oneRe=/^1\.\s*/,odiaOneRe=/^୧\.\s*/;
    const optRe=lang==='english'?/^([a-e]\)|\([1-5]\)|[1-5]\.)\s*/i:/^([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)\s*/;
    const ansRe=lang==='english'?/^Answer:\s*([a-e]\)|\([1-5]\)|[1-5]\.)/i:/^ଉତ୍ତର:\s*([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)/;
    while(i<lines.length){
        while(i<lines.length&&!lines[i].trim())i++;
        if(i>=lines.length) break;
        const line=lines[i].trim(),isNum=numRe.test(line),isOne=oneRe.test(line)||odiaOneRe.test(line);
        if(!isNum){
            let j=i+1; while(j<lines.length&&!lines[j].trim())j++;
            if(j<lines.length&&(oneRe.test(lines[j].trim())||odiaOneRe.test(lines[j].trim()))){
                if(curSubj&&curMcqs.length>0){subjects.set(curSubj,[...curMcqs]);curMcqs=[];}
                curSubj=line; i=j; continue;
            }
            i++; continue;
        }else{
            if(!curSubj) curSubj='General';
            let qLines=[lines[i]]; i++;
            while(i<lines.length){ while(i<lines.length&&!lines[i].trim())i++; if(i>=lines.length) break; if(optRe.test(lines[i].trim())) break; qLines.push(lines[i]); i++; }
            let opts=[];
            while(i<lines.length){ while(i<lines.length&&!lines[i].trim())i++; if(i>=lines.length) break; if(optRe.test(lines[i].trim())){opts.push(lines[i]);i++;}else break; }
            let ans=null; while(i<lines.length&&!lines[i].trim())i++;
            if(i<lines.length&&ansRe.test(lines[i].trim())){ans=lines[i];i++;}
            if(opts.length>=4&&ans&&curSubj) curMcqs.push({question:qLines.join('\n'),options:opts,answer:ans});
        }
    }
    if(curSubj&&curMcqs.length>0) subjects.set(curSubj,curMcqs);
    return subjects;
}

function parseMCQs(allLines,lang){
    const questions=[],remaining=[]; let i=0;
    const optRe=lang==='english'?/^([a-e]\)|\([1-5]\)|[1-5]\.)\s*/i:/^([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)\s*/;
    const ansRe=lang==='english'?/^Answer:\s*([a-e]\)|\([1-5]\)|[1-5]\.)/i:/^ଉତ୍ତର:\s*([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)/;
    while(i<allLines.length){
        while(i<allLines.length&&!allLines[i].trim())i++;
        if(i>=allLines.length) break;
        let q=[];
        while(i<allLines.length){ const l=allLines[i].trim(); if(optRe.test(l)||ansRe.test(l)) break; q.push(allLines[i]); i++; }
        if(!q.length){remaining.push(allLines[i]);i++;continue;}
        let optStart=i,opts=[];
        while(i<allLines.length){ while(i<allLines.length&&!allLines[i].trim())i++; if(i>=allLines.length) break; if(optRe.test(allLines[i].trim())){opts.push(allLines[i]);i++;}else break; }
        if(opts.length<4){remaining.push(...q,...allLines.slice(optStart,i));continue;}
        while(i<allLines.length&&!allLines[i].trim())i++;
        if(i<allLines.length&&ansRe.test(allLines[i].trim())){
            questions.push({question:q.join('\n'),options:opts,answer:allLines[i]});i++;
        }else{remaining.push(...q,...opts);}
    }
    remaining.push(...allLines.slice(i));
    return {questions,remainingLines:remaining};
}

function loadPageList(sectionIndex,chapterIndex,pages){

    const ci=document.getElementById('contentInner');
    subPages=pages;
    navPush({type:'pages',si:sectionIndex,ci:chapterIndex,pages:pages});
    let html=`<div class="section">`;
    html+=`<div class="nav-bar-top"><button class="nav-top-btn home-top-btn" id="homeFromPages">🏠 Home</button></div>`;
    html+=`<h1 class="section-title">${escapeHtml(sections[sectionIndex].chapters[chapterIndex].name)} – Pages</h1><ul class="chapter-list">`;
    pages.forEach((p,i)=>html+=`<li class="chapter-item" data-page-index="${i}">${escapeHtml(p.name)}</li>`);
    html+=`</ul></div>`;
    ci.innerHTML=html; ci.classList.add('content-text');
    ci.querySelectorAll('.chapter-item').forEach(li=>li.addEventListener('click',e=>loadPageContent(sectionIndex,chapterIndex,parseInt(e.target.dataset.pageIndex))));
    document.getElementById('homeFromPages').addEventListener('click',goHome);
    if(sectionIndex===3&&lastEnglishGrammarPageIndex>=0){
        const items=ci.querySelectorAll('.chapter-item')[lastEnglishGrammarPageIndex];
        if(items){items.scrollIntoView({behavior:'smooth',block:'center'});items.classList.add('highlight');setTimeout(()=>items.classList.remove('highlight'),2000);}
    }
    sentences=[]; currentMcqIndex=0; updateTTSVisibility();
}

function loadPageContent(sectionIndex,chapterIndex,pageIdx){
    stopSpeech();
    const lang=sections[sectionIndex].language,page=subPages[pageIdx];
    const allLines=page.content.split(/\r?\n/);
    const ci=document.getElementById('contentInner');
    if(sectionIndex===3) lastEnglishGrammarPageIndex=pageIdx;
    navPush({type:'pageContent',si:sectionIndex,ci:chapterIndex,pageIdx:pageIdx});
    let html=`<div class="section">`;
    html+=`<div class="nav-bar-top"><button class="nav-top-btn" id="backToPageListTop">← Pages</button><button class="nav-top-btn home-top-btn" id="homeFromPageContent">🏠 Home</button></div>`;
    html+=`<h1 class="section-title">${escapeHtml(page.name)}</h1>`;
    if(sectionIndex===3) html+=`<button id="toggleAnswersBtn" class="reader-btn" style="margin:10px 0 15px;display:inline-block;background:#e3f2fd;color:#1a237e;">Show Answers</button>`;
    allLines.forEach((line,idx)=>{
        const tl=line.trim().toLowerCase();
        const isAns=sectionIndex===3&&(tl.startsWith('answer:')||tl.startsWith('ans:')||tl.startsWith('ans.')||tl.startsWith('solution:')||tl.includes('answer is')||tl.includes('correct answer'));
        html+=`<span data-sentence-index="${idx}"${isAns?' class="answer-line" style="display:none;color:#4caf50;font-weight:bold;"':''}>${escapeHtml(line)}</span><br>`;
    });
    sentences=allLines;
    html+=`</div>`;
    ci.innerHTML=html; ci.classList.add('content-text');
    if(sectionIndex===3){
        const tb=document.getElementById('toggleAnswersBtn');
        if(tb){ let vis=false; tb.addEventListener('click',()=>{ vis=!vis; tb.textContent=vis?'Hide Answers':'Show Answers'; ci.querySelectorAll('span.answer-line').forEach(s=>s.style.display=vis?'inline':'none'); }); }
    }
    document.getElementById('backToPageListTop').addEventListener('click',()=>{ navStack.pop(); loadPageList(sectionIndex,chapterIndex,subPages); });
    document.getElementById('homeFromPageContent').addEventListener('click',goHome);
    currentMcqIndex=0; updateTTSVisibility();
}

/* ── Grammar/Computer Subject Page: show concept text then MCQs ── */
function loadGrammarSubjectPage(sectionIndex, chapterIndex, pageIdx){
    stopSpeech();
    const page = subPages[pageIdx];
    const lang = sections[sectionIndex].language;
    const ci = document.getElementById('contentInner');
    navPush({type:'pageContent', si:sectionIndex, ci:chapterIndex, pageIdx:pageIdx});

    const allLines = page.content.split(/\r?\n/);
    const {questions, remainingLines} = parseMCQs(allLines, lang);

    // Concept/description lines = remainingLines (non-MCQ content)
    let html = `<div class="section">`;
    html += `<div class="nav-bar-top">`;
    html += `<button class="nav-top-btn" id="backToGrammarList">← Subjects</button>`;
    html += `<button class="nav-top-btn home-top-btn" id="homeFromGrammarPage">🏠 Home</button>`;
    html += `</div>`;
    html += `<h1 class="section-title">${escapeHtml(page.name)}</h1>`;

    // Show concept/description text before MCQs
    if(remainingLines.some(l => l.trim())){
        html += `<div class="grammar-concept-box" style="background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border-left:5px solid #43a047;border-radius:10px;padding:16px 18px;margin-bottom:22px;font-size:16px;line-height:1.85;color:#1a237e;white-space:pre-wrap;">`;
        remainingLines.forEach((l, idx) => {
            html += `<span data-sentence-index="${idx}">${escapeHtml(l)}</span>\n`;
        });
        html += `</div>`;
    }

    // Show MCQs after concept
    if(questions.length > 0){
        currentIsFullTest = true;
        currentBatchSize = questions.length;
        currentScore = 0; currentAttempted = 0;
        currentSectionIdx = sectionIndex; currentChapterIdx = chapterIndex; currentSubject = page.name;
        html += `<h2 style="color:#d81b60;margin:18px 0 12px;font-size:18px;text-align:center;">📝 Mock Test</h2>`;
        questions.forEach(q => {
            html += `<div class="mcq" data-answer="${escapeHtml(q.answer.replace(/"/g,'&quot;'))}">`;
            html += `<div class="question-text">${escapeHtml(q.question).replace(/\n/g,'<br>')}</div>`;
            html += `<div class="options">`;
            q.options.forEach((o, oi) => html += `<button class="option-btn" data-oidx="${oi}">${escapeHtml(o)}</button><br>`);
            html += `</div><button class="skip-btn">Skip</button><br>`;
            html += `<div class="answer" style="display:none;">${escapeHtml(q.answer)}</div>`;
            html += `<div class="feedback" style="display:none;"></div></div><hr style="margin:20px 0;">`;
        });
        html += `<div style="text-align:center;margin:20px 0;font-size:17px;font-weight:bold;">Attempted: <span id="attempted-count">0</span> / ${questions.length} | Score: <span id="score-count">0</span></div>`;
    }

    html += `</div>`;
    ci.innerHTML = html;
    ci.classList.add('content-text');
    sentences = remainingLines;
    currentMcqIndex = 0;

    if(questions.length > 0) setupMCQListeners(lang);

    // Store back function for results popup "Chapters" button
    _fullTestBackFn = () => {
        currentIsFullTest = false; _fullTestBackFn = null;
        const ch = sections[sectionIndex].chapters[chapterIndex];
        let html = `<div class="section">`;
        html += `<div class="nav-bar-top"><button class="nav-top-btn home-top-btn" id="homeFromSubj1">🏠 Home</button></div>`;
        html += `<h1 class="section-title">${escapeHtml(ch.name)}</h1><ul class="chapter-list">`;
        subPages.forEach((p,i) => { html += `<li class="chapter-item" data-page-index="${i}">${escapeHtml(p.name)}</li>`; });
        html += `</ul></div>`;
        ci.innerHTML = html; ci.classList.add('content-text'); sentences = [];
        ci.querySelectorAll('.chapter-item').forEach(li => li.addEventListener('click', e => loadGrammarSubjectPage(sectionIndex, chapterIndex, parseInt(e.target.dataset.pageIndex))));
        document.getElementById('homeFromSubj1').addEventListener('click', goHome);
        updateTTSVisibility();
    };

    document.getElementById('backToGrammarList').addEventListener('click', () => {
        navStack.pop(); // remove pageContent entry
        stopSpeech();
        currentIsFullTest = false; _fullTestBackFn = null;
        const ch = sections[sectionIndex].chapters[chapterIndex];
        // Re-render subject list
        let html = `<div class="section">`;
        html += `<div class="nav-bar-top"><button class="nav-top-btn home-top-btn" id="homeFromSubj1">🏠 Home</button></div>`;
        html += `<h1 class="section-title">${escapeHtml(ch.name)}</h1><ul class="chapter-list">`;
        subPages.forEach((p,i) => {
            html += `<li class="chapter-item" data-page-index="${i}">${escapeHtml(p.name)}</li>`;
        });
        html += `</ul></div>`;
        ci.innerHTML = html;
        ci.classList.add('content-text');
        sentences = [];
        ci.querySelectorAll('.chapter-item').forEach(li =>
            li.addEventListener('click', e => loadGrammarSubjectPage(sectionIndex, chapterIndex, parseInt(e.target.dataset.pageIndex)))
        );
        document.getElementById('homeFromSubj1').addEventListener('click', goHome);
        updateTTSVisibility();
    });
    document.getElementById('homeFromGrammarPage').addEventListener('click', goHome);
    updateTTSVisibility();
}

function setupMCQListeners(lang){
    document.querySelectorAll('.option-btn').forEach(btn=>{
        btn.addEventListener('click',function(){
            const md=this.closest('.mcq'),opts=md.querySelectorAll('.option-btn'),ansDiv=md.querySelector('.answer'),fbDiv=md.querySelector('.feedback'),skipBtn=md.querySelector('.skip-btn');
            opts.forEach(b=>b.disabled=true); skipBtn.disabled=true;
            const ansStr=md.dataset.answer,lbRe=lang==='english'?/Answer:\s*(\(?[a-e1-5]\)?\.?)/i:/ଉତ୍ତର:\s*(\(?[କ-ଙ୧-୫]\)?\.?)/;
            const match=ansStr.match(lbRe),correctLabel=match?match[1]:null;
            if(!correctLabel) return;
            let correctIdx=-1;
            opts.forEach((b,i)=>{ const m=b.textContent.trim().match(lang==='english'?/^(\(?[a-e1-5]\)?\.?)/:/^(\(?[କ-ଙ୧-୫]\)?\.?)/); if(m&&m[1]===correctLabel) correctIdx=i; });
            const myIdx=parseInt(this.dataset.oidx);
            let msg,myColor='#f44336';
            if(myIdx===correctIdx){currentScore++;msg='✓ Correct!';myColor='#4caf50';}
            else{msg='✗ Wrong';if(opts[correctIdx]){opts[correctIdx].style.backgroundColor='#4caf50';opts[correctIdx].style.color='white';}}
            this.style.backgroundColor=myColor; this.style.color='white';
            fbDiv.textContent=msg; fbDiv.style.display='block'; fbDiv.style.cssText=`font-weight:bold;color:${myColor==='#4caf50'?'#2e7d32':'#d32f2f'};margin:10px 0;padding:5px;`;
            ansDiv.style.display='block'; speakFeedback(msg);
            currentAttempted++;
            const ac=document.getElementById('attempted-count'),sc=document.getElementById('score-count');
            if(ac) ac.textContent=currentAttempted;
            if(sc) sc.textContent=currentScore;
            if(currentBatchSize>0&&currentAttempted===currentBatchSize) setTimeout(showResultsPopUp,1000);
        });
    });
    document.querySelectorAll('.skip-btn').forEach(btn=>{
        btn.addEventListener('click',function(){
            const md=this.closest('.mcq');
            md.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
            this.disabled=true; this.style.backgroundColor='#ccc';
            md.querySelector('.feedback').textContent='Skipped'; md.querySelector('.feedback').style.color='#ff9800'; md.querySelector('.feedback').style.display='block';
            md.querySelector('.answer').style.display='block';
            currentAttempted++;
            const ac2=document.getElementById('attempted-count'),sc2=document.getElementById('score-count');
            if(ac2) ac2.textContent=currentAttempted;
            if(sc2) sc2.textContent=currentScore;
            if(currentBatchSize>0&&currentAttempted===currentBatchSize) setTimeout(showResultsPopUp,1000);
        });
    });
}

/* ── TTS ── */
function isMCQContent(){ return !!document.getElementById('contentInner').querySelector('.mcq'); }
function hasReadableContent(){
    if(sentences.length>0) return true;
    if(isMCQContent()) return true;
    const ci=document.getElementById('contentInner');
    if(ci && ci.textContent.trim().length>10) return true;
    return false;
}
function updateTTSVisibility(){
    document.getElementById('voiceButton').disabled = false;
    document.getElementById('stopButton').disabled = false;
    document.getElementById('processing-status').textContent='';
}

function populateVoiceList(){
    // AndroidTTS handles voices natively — no Web Speech voices needed
    if(TTS.isAndroidMode()) return;
    if(!window.speechSynthesis) return;
    voices=window.speechSynthesis.getVoices();
    defaultEnglishVoice=voices.find(v=>v.lang.startsWith('en')&&v.name.includes('Google'))||voices.find(v=>v.lang.startsWith('en'));
    defaultHindiVoice=voices.find(v=>v.lang.startsWith('hi')&&v.name.includes('Google'))||voices.find(v=>v.lang.startsWith('hi'));
    defaultOdiaVoice=voices.find(v=>v.lang.startsWith('or')&&v.name.includes('Google'))||voices.find(v=>v.lang.startsWith('or'));
}

function speakFeedback(msg){
    if(isReadingAloud&&isMCQContent()) return;
    if(!isTTSSupported) return;
    TTS.speak(msg, 'en', null);
}

function playSpeech(){
    if(!isTTSSupported||!hasReadableContent()){updateTTSVisibility();return;}
    if(isReadingAloud&&isPaused){
        // Android TTS has no pause/resume — restart from current index
        if(TTS.isAndroidMode()){ isPaused=false; document.getElementById('voiceButton').textContent='⏸️ Pause'; if(isMCQContent()) readNextMCQ(); else readNextSentence(); return; }
        TTS.resume(); isPaused=false; document.getElementById('voiceButton').textContent='⏸️ Pause'; return;
    }
    if(isReadingAloud){
        if(TTS.isAndroidMode()){ TTS.stop(); isPaused=true; isReadingAloud=true; document.getElementById('voiceButton').textContent='▶️ Resume'; return; }
        TTS.pause(); isPaused=true; document.getElementById('voiceButton').textContent='▶️ Resume'; return;
    }
    stopSpeech(); isReadingAloud=true; isPaused=false; document.getElementById('voiceButton').textContent='⏸️ Pause';
    if(isMCQContent()){
        if(sentences.length===0) collectContentSentences();
        document.getElementById('processing-status').textContent='Reading MCQs...';
        readNextMCQ();
    } else if(sentences.length>0){
        currentSentenceIndex=lastTappedSentenceIndex>=0?lastTappedSentenceIndex:(currentSentenceIndex>=sentences.length-1?0:currentSentenceIndex+1);
        readNextSentence();
    } else {
        collectContentSentences();
        currentSentenceIndex=0;
        readNextSentence();
    }
}

function collectContentSentences(){
    const ci=document.getElementById('contentInner');
    if(!ci) return;
    // Walk all text nodes, split by newlines, filter empty
    const walker=document.createTreeWalker(ci, NodeFilter.SHOW_TEXT, {
        acceptNode(node){
            const p=node.parentElement;
            // Skip hidden elements and script/style
            if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE') return NodeFilter.FILTER_REJECT;
            if(p.closest('.mm-note')||p.closest('.mindmap-toggle')||p.closest('.mindmap-leaf')){
                return NodeFilter.FILTER_ACCEPT;
            }
            return NodeFilter.FILTER_ACCEPT;
        }
    });
    const collected=[];
    while(walker.nextNode()){
        const t=walker.currentNode.textContent.trim();
        if(t) t.split(/\n|。|[.!?]\s+/).forEach(s=>{const st=s.trim();if(st.length>1)collected.push(st);});
    }
    sentences=collected;
}

function speakWithCallback(text,cb){
    if(!isReadingAloud) return;
    speechUtterances=[]; activeUtterances=0;
    // Use TTS bridge (handles both Android native TTS and Web Speech API)
    TTS.speakMultiLang(text, ()=>{ if(isReadingAloud) setTimeout(cb, 300); });
}

function readNextMCQ(){
    const mcqs=document.querySelectorAll('.mcq');
    if(currentMcqIndex>=mcqs.length||!isReadingAloud){stopSpeech();return;}
    const md=mcqs[currentMcqIndex]; md.scrollIntoView({behavior:'smooth',block:'center'});
    const qDiv=md.querySelector('.question-text'),optsDiv=md.querySelector('.options'),ansDiv=md.querySelector('.answer');
    const optBtns=Array.from(md.querySelectorAll('.option-btn'));
    const qText=qDiv.textContent,optText=optBtns.map(b=>b.textContent).join('. ');
    const ansStr=md.dataset.answer||ansDiv.textContent;
    let clm=ansStr.match(/Answer:\s*(\(?[a-eA-E1-5]\)?\.?)/i)||ansStr.match(/ଉତ୍ତର:\s*(\(?[କ-ଙ୧-୫]\)?\.?)/);
    let cl=clm?clm[1]:null,ci2=-1;
    optBtns.forEach((b,i)=>{ const m=b.textContent.trim().match(/^(\(?[a-eA-E1-5]\)?\.?)/)||b.textContent.trim().match(/^(\(?[କ-ଙ୧-୫]\)?\.?)/); if(m&&m[1]===cl) ci2=i; });
    if(ci2===-1){ const ac=ansStr.replace(/Answer:|ଉତ୍ତର:/ig,'').trim(); ci2=optBtns.findIndex(b=>b.textContent.includes(ac)||ac.includes(b.textContent)); if(ci2===-1) ci2=0; }
    const correctBtn=optBtns[ci2],ansSpeech=' '+correctBtn.textContent;
    qDiv.style.backgroundColor='#ffff99';
    speakWithCallback(qText,()=>{
        qDiv.style.backgroundColor='';
        if(!isReadingAloud) return;
        optsDiv.style.backgroundColor='#e0f7fa';
        speakWithCallback(' '+optText,()=>{
            optsDiv.style.backgroundColor='';
            if(!isReadingAloud) return;
            if(!correctBtn.disabled) correctBtn.click();
            ansDiv.style.backgroundColor='#c8e6c9';
            speakWithCallback(ansSpeech,()=>{
                ansDiv.style.backgroundColor='#e3f2fd';
                if(!isReadingAloud) return;
                currentMcqIndex++; readNextMCQ();
            });
        });
    });
}

function readNextSentence(){
    if(!isTTSSupported||sentences.length===0){updateTTSVisibility();return;}
    while(currentSentenceIndex<sentences.length&&!sentences[currentSentenceIndex].trim()) currentSentenceIndex++;
    if(currentSentenceIndex>=sentences.length||!isReadingAloud){
        stopSpeech();
        if(currentSentenceIndex>=sentences.length&&lastTappedFile){clearLastTappedPosition(lastTappedFile);lastTappedSentenceIndex=-1;}
        return;
    }
    const text=sentences[currentSentenceIndex];
    // Highlight the current sentence span
    const spans=document.getElementById('contentInner').querySelectorAll('span[data-sentence-index]');
    spans.forEach(s=>s.classList.remove('highlight'));
    const cs=Array.from(spans).find(s=>parseInt(s.getAttribute('data-sentence-index'))===currentSentenceIndex);
    if(cs){ cs.classList.add('highlight'); const ci=document.getElementById('contentInner'),sr=cs.getBoundingClientRect(),cr=ci.getBoundingClientRect(); ci.scrollTop+=sr.top-cr.top-(cr.height/2)+(sr.height/2); }
    speechUtterances=[]; activeUtterances=0;
    // Use TTS bridge — handles multi-lang text and both Android/Web Speech
    TTS.speakMultiLang(text, ()=>{
        if(!isReadingAloud) return;
        currentSentenceIndex++;
        if(lastTappedFile) saveLastTappedPosition(lastTappedFile, currentSentenceIndex, 0);
        readNextSentence();
    });
}

function stopSpeech(){
    TTS.stop();
    speechUtterances=[]; activeUtterances=0; isReadingAloud=false; isPaused=false; isDictionaryReading=false;
    document.getElementById('voiceButton').textContent='🗣️ Speak';
    document.getElementById('stopButton').disabled=false;
    document.getElementById('voiceButton').disabled=false;
    document.getElementById('contentInner').querySelectorAll('span[data-sentence-index]').forEach(s=>{s.classList.remove('highlight');s.style.display='inline';});
    document.querySelectorAll('.mcq .question-text,.mcq .options,.mcq .answer').forEach(el=>{el.style.backgroundColor=el.classList.contains('answer')?'#e3f2fd':'';});
    updateTTSVisibility();
}

/* ── Text Selection → Popup ── */
function setupInteractionListeners(){
    const ci=document.getElementById('contentInner');
    ci.addEventListener('mouseup',handleTextSelection);
    ci.addEventListener('touchend',handleTextSelection);
}

function handleTextSelection(e){
    if(!document.getElementById('contentArea').classList.contains('active')) return;
    const sel=window.getSelection(),txt=sel.toString().trim();
    if(txt){
        const range=sel.getRangeAt(0),el=range.startContainer.parentElement.closest('span[data-sentence-index]');
        if(el){ lastTappedSentenceIndex=parseInt(el.getAttribute('data-sentence-index'),10); if(lastTappedFile) saveLastTappedPosition(lastTappedFile,lastTappedSentenceIndex,0); }
        const words=txt.split(/\s+/).filter(w=>w.match(/[A-Za-z\u0B00-\u0B7F]/));
        if(words.length>0) showPopup(words[0].replace(/[^A-Za-z\u0B00-\u0B7F]/g,'').trim());
        sel.removeAllRanges();
    }
}

/* ── Load Content ── */
async function loadContent(sectionIndex, chapterIndex){
    const chapter = sections[sectionIndex].chapters[chapterIndex];
    if(chapter.type === 'link'){ window.open(chapter.url, '_blank'); return; }
    
    stopSpeech();
    navPush({type:'chapter',si:sectionIndex,ci:chapterIndex});
    const contentArea = document.getElementById('contentArea');
    const ci = document.getElementById('contentInner');
    const cc = document.getElementById('chapterContainer');
    
    ci.innerHTML = ''; 
    lastTappedFile = chapter.url; 
    lastTappedSentenceIndex = -1; 
    currentMcqIndex = 0; 
    sentences = [];
    document.getElementById('readerChapterName').textContent = chapter.name;
    
    const content = await loadResource(chapter.url);
    if(!content){
        ci.innerHTML = '<p>Offline: Content not cached.</p>';
        contentArea.classList.add('active'); 
        cc.classList.add('hidden'); 
        return;
    }
    
    const textContent = await content.text();

    if(chapter.type === 'html'){
        // ── Mind Map check FIRST (even if file has full <html> wrapper) ──
        if(isMindMapHtml(textContent)){
            ci.innerHTML = '';
            buildMindMap(ci, textContent);
            ci.classList.remove('content-text');
            sentences = [];
            contentArea.classList.add('active');
            cc.classList.add('hidden');
            setupInteractionListeners();
            updateTTSVisibility();
            return;
        // ── Standalone HTML / App: full document with scripts/styles → iframe ──
        } else if (/<html/i.test(textContent) && /<head/i.test(textContent) && (/<script/i.test(textContent) || /<style/i.test(textContent))) {
            document.getElementById('iframeChapterName').textContent = chapter.name;
            document.getElementById('app-iframe').srcdoc = textContent;
            cc.classList.add('hidden');
            document.getElementById('iframe-container').classList.add('active');
            return;
        } else {
            const tempDiv = document.createElement('div');
            if(sectionIndex === 2) tempDiv.style.whiteSpace = 'pre'; else tempDiv.style.whiteSpace = 'pre-wrap';
            tempDiv.innerHTML = textContent;
            
            const processNode = (node) => {
                if(node.nodeType === 3){
                    const tc = node.textContent, words = tc.split(/(\s+)/), frag = document.createDocumentFragment(), si = sentences.length;
                    words.forEach(w => {
                        if(w.match(/\s+/)){ frag.appendChild(document.createTextNode(w)); }
                        else if(w.match(/[A-Za-z\u0B00-\u0B7F]/)){
                            const sp = document.createElement('span');
                            sp.setAttribute('data-word', w.replace(/[^A-Za-z\u0B00-\u0B7F]/g, ''));
                            sp.setAttribute('data-sentence-index', si);
                            sp.textContent = w;
                            frag.appendChild(sp);
                        } else { frag.appendChild(document.createTextNode(w)); }
                    });
                    sentences.push(tc.trim()); 
                    node.parentNode.replaceChild(frag, node);
                } else if(node.nodeType === 1) { node.childNodes.forEach(processNode); }
            };
            tempDiv.childNodes.forEach(processNode);
            ci.appendChild(tempDiv); 
            ci.classList.remove('content-text');
        }
    } else if (chapter.type === 'text') {
        const isTheory = chapter.name.includes('Theory');
        const isEnglishGrammar = chapter.name.includes('English Grammar');
        const isComputer = chapter.name.includes('Computer');

        if (isTheory || isEnglishGrammar || isComputer) {
            let pages = [];
            const rx = /###\s*(.*?)\s*###([\s\S]*?)(?=###|$)/g; 
            let m;
            while((m = rx.exec(textContent)) !== null) {
                pages.push({name: m[1].trim(), content: m[2].trim()});
            }
            
            if(!pages.length) pages = [{name: chapter.name, content: textContent}];

            if (isComputer || isEnglishGrammar) {
                // Show subject list from ### subject ### sections.
                // Each subject page shows all content text first, then all MCQs as one full test (no set splitting).
                if(pages.length > 0){
                    subPages = pages;
                    let html = `<div class="section">`;
                    html += `<div class="nav-bar-top"><button class="nav-top-btn home-top-btn" id="homeFromSubj1">🏠 Home</button></div>`;
                    html += `<h1 class="section-title">${escapeHtml(chapter.name)}</h1><ul class="chapter-list">`;
                    pages.forEach((p,i) => {
                        html += `<li class="chapter-item" data-page-index="${i}">${escapeHtml(p.name)}</li>`;
                    });
                    html += `</ul></div>`;
                    ci.innerHTML = html;
                    ci.classList.add('content-text');
                    ci.querySelectorAll('.chapter-item').forEach(li =>
                        li.addEventListener('click', e => loadGrammarSubjectPage(sectionIndex, chapterIndex, parseInt(e.target.dataset.pageIndex)))
                    );
                    document.getElementById('homeFromSubj1').addEventListener('click', goHome);
                    sentences = [];
                } else {
                    loadPageList(sectionIndex, chapterIndex, pages);
                }
            } else {
                loadPageList(sectionIndex, chapterIndex, pages);
            }
            
        } else {
            const allLines = textContent.split(/\r?\n/), lang = sections[sectionIndex].language;
            const subjects = parseChapterToSubjects(allLines, lang, chapter.name);
            currentSubjectsMap = subjects; 
            currentChapterName = chapter.name;
            
            let html = `<div class="section"><h1 class="section-title">${escapeHtml(chapter.name)} – Subjects</h1><ul class="chapter-list">`;
            let hasSub = false;
            
            for(let [sn, ml] of subjects){
                if(ml.length > 0){
                    html += `<li class="chapter-item" data-subject="${escapeHtml(sn)}">${escapeHtml(sn)}</li>`;
                    hasSub = true;
                }
            }
            
            if (hasSub) {
                html += '</ul></div>'; 
                ci.innerHTML = html; 
                ci.classList.add('content-text');
                const navEl = document.createElement('div');
                navEl.className = 'nav-bar-top';
                navEl.innerHTML = '<button class="nav-top-btn home-top-btn" id="homeFromSubj2">🏠 Home</button>';
                ci.querySelector('.section').insertBefore(navEl, ci.querySelector('.section-title'));
                document.getElementById('homeFromSubj2').addEventListener('click', goHome);
                ci.querySelectorAll('.chapter-item').forEach(li => 
                    li.addEventListener('click', e => loadSubjectSets(sectionIndex, chapterIndex, e.target.dataset.subject))
                );
                sentences = [];
            } else {
                const {questions, remainingLines} = parseMCQs(allLines, lang);
                let mh = '';
                questions.forEach(q => {
                    mh += `<div class="mcq" data-answer="${escapeHtml(q.answer.replace(/"/g,'&quot;'))}"><div class="question-text">${escapeHtml(q.question).replace(/\n/g,'<br>')}</div><div class="options">`;
                    q.options.forEach((o, oi) => mh += `<button class="option-btn" data-oidx="${oi}">${escapeHtml(o)}</button><br>`);
                    mh += `</div><button class="skip-btn">Skip</button><br><div class="answer" style="display:none;">${escapeHtml(q.answer)}</div><div class="feedback" style="display:none;"></div></div><hr style="margin:20px 0;">`;
                });
                
                let rh = '';
                remainingLines.forEach((l, i) => {
                    if(questions.length > 0) rh += `<span>${escapeHtml(l)}</span><br>`;
                    else rh += `<span data-sentence-index="${i}">${escapeHtml(l)}</span><br>`;
                });
                
                ci.innerHTML = mh + rh; 
                ci.classList.add('content-text');
                if(questions.length > 0){ setupMCQListeners(lang); sentences = []; }
                else { sentences = remainingLines; }
            }
        }
    }
    
    contentArea.classList.add('active'); 
    cc.classList.add('hidden');
    
    const saved = loadLastTappedPosition(chapter.url);
    currentSentenceIndex = saved ? saved.sentenceIndex : -1; 
    lastTappedSentenceIndex = currentSentenceIndex;
    
    setupInteractionListeners(); 
    updateTTSVisibility();
}

/* ── File Upload ── */
async function handleFileUpload(event){
    const files=Array.from(event.target.files);
    if(!files.length) return;
    const ci=document.getElementById('contentInner'),ca=document.getElementById('contentArea'),cc=document.getElementById('chapterContainer');
    stopSpeech(); ci.innerHTML=''; lastTappedFile=files[0].name; lastTappedSentenceIndex=-1; sentences=[]; currentMcqIndex=0;
    document.getElementById('readerChapterName').textContent=files[0].name;
    const pdfs=files.filter(f=>f.name.endsWith('.pdf')),txts=files.filter(f=>f.name.endsWith('.txt')||f.name.endsWith('.html'));
    try{
        if(pdfs.length>0){
            showProgress('Processing PDFs',0);
            // Use IDB-cached worker blob URL (set during bootstrap)
            if(window.pdfjsLib && window._pdfWorkerBlobUrl)
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = window._pdfWorkerBlobUrl;
            let tot='';
            for(let i=0;i<pdfs.length;i++){
                const ab=await pdfs[i].arrayBuffer(),pdf=await pdfjsLib.getDocument({data:ab}).promise;
                let t='';
                for(let j=1;j<=pdf.numPages;j++){const pg=await pdf.getPage(j);const tc=await pg.getTextContent();t+=tc.items.map(x=>x.str).join(' ')+'\n';showProgress('Processing PDFs',Math.round(((j/pdf.numPages)*(100/pdfs.length))+(i*(100/pdfs.length))));}
                tot+=t+'\n';
            }
            const lines=tot.split(/\r?\n/),lang='english',{questions,remainingLines}=parseMCQs(lines,lang);
            let html='';
            questions.forEach(q=>{html+=`<div class="mcq" data-answer="${escapeHtml(q.answer.replace(/"/g,'&quot;'))}"><div class="question-text">${escapeHtml(q.question).replace(/\n/g,'<br>')}</div><div class="options">`;q.options.forEach((o,oi)=>html+=`<button class="option-btn" data-oidx="${oi}">${escapeHtml(o)}</button><br>`);html+=`</div><button class="skip-btn">Skip</button><br><div class="answer" style="display:none;">${escapeHtml(q.answer)}</div><div class="feedback" style="display:none;"></div></div><hr style="margin:20px 0;">`});
            remainingLines.forEach(l=>html+=`<span>${escapeHtml(l)}</span><br>`);
            ci.innerHTML+=html; ci.classList.add('content-text');
            if(questions.length>0) setupMCQListeners(lang); else sentences=remainingLines;
            hideProgress();
        }
        if(txts.length>0){
            showProgress('Processing files',0);
            for(let i=0;i<txts.length;i++){
                const file=txts[i]; let fh='';
                if(file.name.endsWith('.txt')){
                    const text=await file.text(),lines=text.split(/\r?\n/),lang='english';
                    const subj=parseChapterToSubjects(lines,lang,file.name);
                    if(subj.size>0){
                        currentSubjectsMap=subj; fh+=`<div class="section"><h1 class="section-title">Subjects</h1><ul class="chapter-list">`;
                        for(let [sn,ml] of subj) if(ml.length>0) fh+=`<li class="chapter-item" data-subject="${escapeHtml(sn)}">${escapeHtml(sn)}</li>`;
                        fh+='</ul></div>'; ci.innerHTML+=fh; ci.querySelectorAll('.chapter-item').forEach(li=>li.addEventListener('click',e=>loadSubjectSets(0,0,e.target.dataset.subject)));
                        ci.classList.add('content-text'); sentences=[];
                    }else{
                        const {questions,remainingLines}=parseMCQs(lines,lang);
                        if(questions.length>0){
                            questions.forEach(q=>{fh+=`<div class="mcq" data-answer="${escapeHtml(q.answer.replace(/"/g,'&quot;'))}"><div class="question-text">${escapeHtml(q.question).replace(/\n/g,'<br>')}</div><div class="options">`;q.options.forEach((o,oi)=>fh+=`<button class="option-btn" data-oidx="${oi}">${escapeHtml(o)}</button><br>`);fh+=`</div><button class="skip-btn">Skip</button><br><div class="answer" style="display:none;">${escapeHtml(q.answer)}</div><div class="feedback" style="display:none;"></div></div><hr style="margin:20px 0;">`});
                            remainingLines.forEach(l=>fh+=`<span>${escapeHtml(l)}</span><br>`);
                            setupMCQListeners(lang); sentences=[];
                        }else{
                            remainingLines.forEach((l,idx)=>fh+=`<span data-sentence-index="${sentences.length+idx}">${escapeHtml(l)}</span><br>`);
                            sentences=sentences.concat(remainingLines);
                        }
                        ci.innerHTML+=fh; ci.classList.add('content-text');
                    }
                }else{
                    const text=await file.text();
                    if(isMindMapHtml(text)){
                        ci.innerHTML='';
                        buildMindMap(ci, text);
                        ci.classList.remove('content-text');
                        sentences=[];
                    } else {
                        const tempDiv=document.createElement('div');
                        tempDiv.innerHTML=text;
                        const processNode=(node)=>{
                            if(node.nodeType===3){const tc=node.textContent,words=tc.split(/(\s+)/),frag=document.createDocumentFragment(),si=sentences.length;words.forEach(w=>{if(w.match(/\s+/))frag.appendChild(document.createTextNode(w));else if(w.match(/[A-Za-z\u0B00-\u0B7F]/)){const sp=document.createElement('span');sp.setAttribute('data-word',w.replace(/[^A-Za-z\u0B00-\u0B7F]/g,''));sp.setAttribute('data-sentence-index',si);sp.textContent=w;frag.appendChild(sp);}else frag.appendChild(document.createTextNode(w));});sentences.push(tc.trim());node.parentNode.replaceChild(frag,node);}else if(node.nodeType===1)node.childNodes.forEach(processNode);
                        };
                        tempDiv.childNodes.forEach(processNode); ci.appendChild(tempDiv); ci.classList.remove('content-text');
                    }
                }
                showProgress('Processing files',Math.round(((i+1)/txts.length)*100));
            }
            hideProgress();
        }
        const saved=loadLastTappedPosition(lastTappedFile);
        currentSentenceIndex=saved?saved.sentenceIndex:-1; lastTappedSentenceIndex=currentSentenceIndex;
        ca.classList.add('active'); cc.classList.add('hidden');
        setupInteractionListeners(); updateTTSVisibility();
    }catch(e){ console.error(e); ci.innerHTML='<p>Error processing file.</p>'; hideProgress(); updateTTSVisibility(); }
}

/* ── Build Chapter Grid ── */
const sectionsContainer=document.getElementById('sections');
sections.forEach((section,si)=>{
    const div=document.createElement('div'); div.className='section'; div.id=`section-${si}`;
    const title=document.createElement('h2'); title.className='section-title'; title.textContent=section.title;
    div.appendChild(title);
    const ul=document.createElement('ul'); ul.className='chapter-list';
    section.chapters.forEach((ch,ci2)=>{
        const li=document.createElement('li'); li.className='chapter-item'; li.id=`chapter-${si}-${ci2}`; li.textContent=ch.name;
        li.addEventListener('click',()=>{ currentSectionIndex=si; currentChapterIndex=ci2; loadContent(si,ci2); });
        ul.appendChild(li);
    });
    div.appendChild(ul); sectionsContainer.appendChild(div);
});

/* ══════════════════════════════════════════════════════════════
   NAVIGATION STACK
   Each entry: { type, ...params }
   Types: 'home' | 'chapter' | 'subjects' | 'sets' | 'mcqs' | 'pages' | 'pageContent'
   ══════════════════════════════════════════════════════════════ */
let navStack = [];

function navPush(entry){ navStack.push(entry); }

function goHome(){
    stopSpeech();
    navStack = [];
    document.getElementById('contentArea').classList.remove('active');
    document.getElementById('iframe-container').classList.remove('active');
    document.getElementById('chapterContainer').classList.remove('hidden');
    document.getElementById('contentInner').innerHTML='';
    document.getElementById('app-iframe').srcdoc='';
    document.getElementById('fileUpload').value='';
    sentences=[]; currentSentenceIndex=-1; currentMcqIndex=0;
    lastTappedSentenceIndex=-1; lastTappedFile=null;
    currentSubjectsMap=null; currentChapterName=''; currentSubjectName='';
    updateTTSVisibility();
    if(currentSectionIndex!==null&&currentChapterIndex!==null){
        const se=document.getElementById(`section-${currentSectionIndex}`),ce=document.getElementById(`chapter-${currentSectionIndex}-${currentChapterIndex}`);
        if(se&&ce){se.scrollIntoView({behavior:'smooth',block:'start'});ce.classList.add('highlight');setTimeout(()=>ce.classList.remove('highlight'),2000);}
    }
}

function goBack(){
    // Close popup if open
    const popup=document.getElementById('popup');
    if(popup.classList.contains('visible')){
        popup.classList.remove('visible');
        setTimeout(()=>{popup.style.display='none';document.getElementById('popupContent').innerHTML='';},200);
        return;
    }
    // Iframe: go back inside iframe first, then exit iframe
    const iframeContainer=document.getElementById('iframe-container');
    if(iframeContainer.classList.contains('active')){
        const iframe=document.getElementById('app-iframe');
        try{
            if(iframe.contentWindow&&iframe.contentWindow.history.length>1){
                iframe.contentWindow.history.back();
                return;
            }
        }catch(e){}
        // Exit iframe → go home
        iframeContainer.classList.remove('active');
        document.getElementById('chapterContainer').classList.remove('hidden');
        document.getElementById('app-iframe').srcdoc='';
        navStack=[];
        return;
    }
    // Content area: pop nav stack
    if(navStack.length>1){
        navStack.pop(); // remove current
        const prev=navStack.pop(); // we'll re-push inside the called fn
        stopSpeech();
        if(prev.type==='chapter') loadContent(prev.si,prev.ci);
        else if(prev.type==='subjects') loadContent(prev.si,prev.ci); // re-loads subject list
        else if(prev.type==='sets') loadSubjectSets(prev.si,prev.ci,prev.subject);
        else if(prev.type==='mcqs') loadSubjectMCQs(prev.si,prev.ci,prev.subject,prev.batch);
        else if(prev.type==='pages') loadPageList(prev.si,prev.ci,prev.pages);
        else if(prev.type==='pageContent') loadPageContent(prev.si,prev.ci,prev.pageIdx);
        else goHome();
    } else {
        goHome();
    }
}

/* Android back button bridge — called by AndroidBridge.onBackPressed() */
window._appGoBack = goBack;

/* ── Init ── */
async function init(){
    await cacheFiles();
    await initDatabases();
    populateVoiceList();
    if(isTTSSupported && !TTS.isAndroidMode()) window.speechSynthesis.onvoiceschanged=populateVoiceList;

    document.getElementById('fileUpload').addEventListener('change',handleFileUpload);
    document.getElementById('voiceButton').addEventListener('click',playSpeech);
    document.getElementById('stopButton').addEventListener('click',stopSpeech);

    document.getElementById('homeButton').addEventListener('click', goHome);
    document.getElementById('backButton').addEventListener('click', goBack);

    document.getElementById('popupClose').addEventListener('click',()=>{
        const p=document.getElementById('popup'); p.classList.remove('visible');
        setTimeout(()=>{p.style.display='none';document.getElementById('popupContent').innerHTML='';},200);
    });

    document.getElementById('iframeHomeButton').addEventListener('click', goHome);

    // Hardware back button (Android WebView calls window._appGoBack via JavascriptInterface,
    // but also intercept browser popstate for browsers)
    window.addEventListener('popstate', e => { e.preventDefault(); goBack(); });
    // Push a dummy state so popstate fires on first back press
    history.pushState({app:true}, '');
}

window.addEventListener('load',init);
