    <style>
        @font-face {
            font-family: 'Noto Sans';

            src: url('https://cdn.jsdelivr.net/npm/@fontsource/noto-sans@5.0.22/files/noto-sans-all-700-normal.woff') format('woff');
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', sans-serif;
            font-weight: bold;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            overflow-x: hidden;
            min-height: 100vh;
            color: #1a237e;
        }

        /* ── Floating Donate Button – bottom right, never overlaps ── */

            z-index: 600;

            border: none;
            border-radius: 30px;
            padding: 10px 18px;

        /* ── Main Container ── */
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 16px 120px;
        }

       .app-title {
           text-align: center;
          font-size: 28px;
          color: #d81b60;
          text-shadow: 1px 1px 3px rgba(255,255,255,0.7);

}

        /* ── Section & Chapter List – centered beautiful UI ── */
        .section { margin-bottom: 44px; }
        .section-title {
            color: #fff;
            font-size: 20px;
            margin: 0 0 18px;
            padding: 10px 22px;
            background: linear-gradient(135deg, #d81b60, #7b1fa2);

            display: block;
            text-align: center;
            box-shadow: 0 4px 14px rgba(216,27,96,0.35);
            letter-spacing: 0.5px;
        }
        .chapter-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            padding: 0;
            margin: 0;
            justify-content: center;
            align-items: center;
        }
        .chapter-item {
            background: linear-gradient(135deg, #fff9c4, #ffd54f);
            color: #1a237e;
            padding: 14px 20px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            min-width: 130px;
            max-width: 200px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.13);
            transition: transform 0.22s, box-shadow 0.22s, background 0.22s;
            border: 2px solid #e91e63;
            text-align: center;
            user-select: none;
            line-height: 1.4;
        }
        .chapter-item:hover {
            transform: translateY(-4px) scale(1.06);
            box-shadow: 0 8px 22px rgba(233,30,99,0.3);
            background: linear-gradient(135deg, #ffeb3b, #ffc107);
        }
        .chapter-item.highlight { background: linear-gradient(135deg, #80cbc4, #4db6ac) !important; border-color: #00796b; }

        /* ── File Upload Strip ── */
        .file-upload-strip {
            margin: 10px 0 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.65);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            color: #1a237e;
        }
        .file-upload-strip input { font-size: 14px; }

        /* ── Reader / Content Area ── */
        .content {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f5f5f5;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            z-index: 10;
        }
        .content.active { display: flex; flex-direction: column; }

        /* Reader top bar */
        .reader-topbar {
            background: #1a237e;
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .reader-topbar .chapter-name {
            flex: 1;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .reader-btn {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Noto Sans', sans-serif;
            font-weight: bold;
            transition: background 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .reader-btn:hover { background: rgba(255,255,255,0.3); }
        .reader-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .reader-btn.stop { background: rgba(244,67,54,0.5); }
        .reader-btn.stop:hover { background: rgba(244,67,54,0.75); }

        /* Content scrollable area */
        .content-inner {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 30px;
            font-size: 18px;
            color: #1a237e;
            line-height: 1.75;
            background: white;
        }
        .content-inner img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        .content-text { font-family: 'Noto Sans', sans-serif; white-space: pre-wrap; }
        .content-inner span { display: inline; cursor: pointer; }
        .content-inner .highlight {
            background: #fff59d;
            border-radius: 5px;
            padding: 2px 4px;
            animation: hlGlow 1.2s ease-in-out infinite;
        }
        @keyframes hlGlow {
            0%,100% { background: #fff59d; }
            50% { background: #ffeb3b; }
        }
        .answer-highlight { background: #a5d6a7; border-radius: 5px; padding: 2px 4px; font-weight: bolder; }

        /* ── TTS Controls Bar (below reader content) ── */
        .tts-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #1a237e, #283593);
            flex-shrink: 0;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
        }
        .tts-btn {
            border: none;
            border-radius: 50px;
            padding: 10px 28px;
            font-size: 17px;
            font-family: 'Noto Sans', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        }
        .tts-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
        .tts-btn.speak-tts {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #1a237e;
        }
        .tts-btn.speak-tts:hover:not(:disabled) { transform: scale(1.07); box-shadow: 0 5px 16px rgba(56,249,215,0.4); }
        .tts-btn.stop-tts {
            background: linear-gradient(135deg, #f44336, #ff7043);
            color: white;
        }
        .tts-btn.stop-tts:hover:not(:disabled) { transform: scale(1.07); box-shadow: 0 5px 16px rgba(244,67,54,0.4); }

        /* Status bar at bottom of reader */
        #processing-status {
            font-size: 13px;
            color: #fff;
            text-align: center;
            padding: 3px 0;
            background: #1a237e;
            flex-shrink: 0;
        }

        /* ── MCQ Styles ── */
        .mcq { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 10px; background: #fafafa; }
        .question-text { font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        .options { margin-bottom: 10px; }
        .option-btn { display: block; width: 100%; margin: 5px 0; padding: 10px; background: #f0f0f0; border: none; border-radius: 5px; cursor: pointer; text-align: left; font-size: 16px; font-family: 'Noto Sans', sans-serif; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
        .skip-btn { margin: 10px 0; padding: 8px 16px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .skip-btn:hover { background: #f57c00; }
        .skip-btn:disabled { background: #ccc; cursor: not-allowed; }
        .answer { margin-top: 10px; padding: 10px; border-radius: 5px; background: #e3f2fd; border-left: 4px solid #2196f3; }
        .feedback { margin-top: 10px; padding: 10px; border-radius: 5px; font-weight: bold; }

        /* Back-to buttons inline */
        .back-btn {
            display: inline-block;
            margin: 20px auto;
            padding: 10px 22px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 22px;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            font-family: 'Noto Sans', sans-serif;
            font-weight: bold;
        }
        .back-btn:hover { background: #c2185b; }

        /* ── Popup (Dictionary) ── */
        .popup {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.92);
            background: #f3e7f9;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.22);
            max-width: 92%;
            width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .popup.visible { display: block; opacity: 1; transform: translate(-50%,-50%) scale(1); }
        .popup-content { margin-bottom: 14px; }
        .popup-content div { padding: 12px; border-bottom: 2px dashed #b3e5fc; font-size: 17px; color: #1a237e; background: #e1f5fe; border-radius: 10px; margin-bottom: 8px; }
        .popup-content img { max-width: 100%; height: auto; border-radius: 10px; margin: 10px 0; }
        .popup-content ul { list-style: none; padding: 0; }
        .popup-content li { padding: 11px; cursor: pointer; border-bottom: 1px solid #c8e6c9; font-size: 17px; color: #1a237e; background: #fff; border-radius: 10px; margin-bottom: 7px; transition: background 0.2s; }
        .popup-content li:hover { background: #c8e6c9; }
        .popup-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .popup-close { padding: 8px 16px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; color: white; background: #f44336; font-family: 'Noto Sans', sans-serif; font-weight: bold; }
        .popup-close:hover { background: #d32f2f; }

        /* Dictionary styles inside popup */
        .dictionary-search {
            width: 100%;
            padding: 9px 12px;
            font-size: 17px;
            border: 2px solid #d81b60;
            border-radius: 10px;
            margin-bottom: 12px;
            outline: none;
            font-family: 'Noto Sans', sans-serif;
            font-weight: bold;
        }
        .dictionary-results { min-height: 60px; padding: 8px; border-radius: 10px; background: #e1f5fe; }
        .dictionary-results div { padding: 11px; border-bottom: 2px dashed #b3e5fc; font-size: 17px; color: #1a237e; background: #e1f5fe; border-radius: 10px; margin-bottom: 7px; }
        .dictionary-results img { max-width: 100%; height: auto; border-radius: 10px; margin: 8px 0; }
        .dictionary-suggestions { margin-top: 8px; }
        .dictionary-suggestions ul { list-style: none; padding: 0; }
        .dictionary-suggestions li { padding: 11px; cursor: pointer; border-bottom: 1px solid #c8e6c9; font-size: 17px; color: #1a237e; background: #fff; border-radius: 10px; margin-bottom: 7px; transition: background 0.2s; }
        .dictionary-suggestions li:hover { background: #c8e6c9; }
        .speak-button { background: #2196f3; color: white; padding: 8px 18px; border-radius: 22px; font-size: 17px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.2); border: none; margin-top: 8px; font-family: 'Noto Sans', sans-serif; }
        .speak-button:hover { background: #1976d2; }
        .speak-button:disabled { background: #90caf9; cursor: not-allowed; }
        .image-controls { display: flex; gap: 8px; margin-top: 4px; }
        .delete-button, .restore-button { padding: 7px 13px; font-size: 15px; border: none; border-radius: 9px; cursor: pointer; color: white; transition: transform 0.2s; }
        .delete-button { background: #f44336; }
        .restore-button { background: #4caf50; }
        .delete-button:hover, .restore-button:hover { transform: scale(1.08); }

        /* ── Progress Overlay ── */
        #progress-container {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: 80%; max-width: 520px;
            background: #fff; padding: 22px;
            border-radius: 15px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
            z-index: 2000;
            text-align: center;
            display: none;
        }
        #progress-container.visible { display: block; }
        #progress-bar { width: 100%; height: 18px; background: #e0e0e0; border-radius: 9px; overflow: hidden; }
        #progress-fill { height: 100%; background: #4caf50; width: 0%; transition: width 0.3s ease; }
        #progress-text { margin-top: 10px; font-size: 17px; color: #d81b60; }

        .hidden { display: none !important; }

        /* Answer-line toggle */
        .answer-line { color: #4caf50; font-weight: bold; }

        /* ── Mind Map Styles ── */
        .mindmap-container {
            font-family: 'Noto Sans', sans-serif;
            padding: 10px 4px 20px;
        }
        .mindmap-container h1 {
            text-align: center;
            color: #d81b60;
            font-size: 24px;
            margin: 0 0 18px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            border-radius: 50px;
            box-shadow: 0 3px 10px rgba(216,27,96,0.2);
        }
        .mindmap-root { list-style: none; padding: 0; margin: 0; }
        .mindmap-node {
            position: relative;
            margin: 4px 0;
        }
        .mindmap-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 16px 8px 12px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            font-family: 'Noto Sans', sans-serif;
            border: none;
            text-align: left;
            transition: transform 0.18s, box-shadow 0.18s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            max-width: 100%;
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }
        .mindmap-toggle:hover { transform: scale(1.03); }
        .mindmap-toggle .mm-arrow {
            font-size: 12px;
            transition: transform 0.22s;
            flex-shrink: 0;
        }
        .mindmap-toggle.collapsed .mm-arrow { transform: rotate(-90deg); }

        /* Level colors */
        .mm-level-0 > .mindmap-toggle { background: linear-gradient(135deg, #d81b60, #880e4f); color: #fff; font-size: 17px; }
        .mm-level-1 > .mindmap-toggle { background: linear-gradient(135deg, #1565c0, #0d47a1); color: #fff; font-size: 16px; }
        .mm-level-2 > .mindmap-toggle { background: linear-gradient(135deg, #00838f, #006064); color: #fff; font-size: 15px; }
        .mm-level-3 > .mindmap-toggle { background: linear-gradient(135deg, #558b2f, #33691e); color: #fff; font-size: 14px; }
        .mm-level-4 > .mindmap-toggle { background: linear-gradient(135deg, #e65100, #bf360c); color: #fff; font-size: 14px; }
        .mm-level-5 > .mindmap-toggle { background: linear-gradient(135deg, #6a1b9a, #4a148c); color: #fff; font-size: 13px; }

        /* Leaf node (no children) */
        .mindmap-leaf {
            display: inline-flex;
            align-items: center;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-family: 'Noto Sans', sans-serif;
            font-weight: bold;
            margin: 2px 0;
            line-height: 1.4;
            word-break: break-word;
            white-space: normal;
            max-width: 100%;
        }
        .mm-level-0 > .mindmap-leaf { background: #fce4ec; color: #880e4f; }
        .mm-level-1 > .mindmap-leaf { background: #e3f2fd; color: #0d47a1; }
        .mm-level-2 > .mindmap-leaf { background: #e0f2f1; color: #004d40; }
        .mm-level-3 > .mindmap-leaf { background: #f1f8e9; color: #33691e; }
        .mm-level-4 > .mindmap-leaf { background: #fff3e0; color: #bf360c; }
        .mm-level-5 > .mindmap-leaf { background: #f3e5f5; color: #4a148c; }

        /* Note/pre text below a node */
        .mm-note {
            margin: 4px 0 6px 28px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #fffde7, #fff9c4);
            border-left: 4px solid #fbc02d;
            border-radius: 0 10px 10px 0;
            font-size: 13px;
            color: #4e342e;
            font-weight: normal;
            font-family: 'Noto Sans', sans-serif;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Children container */
        .mindmap-children {
            padding-left: 22px;
            border-left: 2px dashed rgba(0,0,0,0.12);
            margin-left: 16px;
            margin-top: 4px;
            overflow: hidden;
            transition: max-height 0.35s ease, opacity 0.3s ease;
            max-height: 9999px;
            opacity: 1;
        }
        .mindmap-children.hidden-children {
            max-height: 0 !important;
            opacity: 0;
        }

        @media (max-width: 520px) {
            .chapter-item { font-size: 14px; padding: 11px 14px; min-width: 110px; }
            .app-title { font-size: 22px; }
            .section-title { font-size: 17px; }
            .tts-btn { padding: 9px 20px; font-size: 15px; }
        }
    </style>
</head>

/* ── Mind Map Renderer ── */
function isMindMapHtml(htmlString) {
    // Detect if the HTML looks like a nested UL mind map (h1 + ul structure)
    const div = document.createElement('div');
    div.innerHTML = htmlString;
    const h1 = div.querySelector('h1');
    const ul = div.querySelector('ul');
    return !!(h1 && ul);
}

function buildMindMap(container, htmlString) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = htmlString;

    const wrapper = document.createElement('div');
    wrapper.className = 'mindmap-container';

    // Title
    const h1 = tempDiv.querySelector('h1');
    if (h1) {
        const title = document.createElement('h1');
        title.textContent = h1.textContent;
        wrapper.appendChild(title);
    }

    // Collapse All / Expand All controls
    const ctrlBar = document.createElement('div');
    ctrlBar.style.cssText = 'text-align:center;margin-bottom:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;';
    const collapseAllBtn = document.createElement('button');
    collapseAllBtn.textContent = '⊟ Collapse All';
    collapseAllBtn.style.cssText = 'padding:8px 18px;border-radius:30px;border:none;background:linear-gradient(135deg,#e91e63,#c2185b);color:#fff;font-weight:bold;cursor:pointer;font-size:14px;font-family:inherit;';
    const expandAllBtn = document.createElement('button');
    expandAllBtn.textContent = '⊞ Expand All';
    expandAllBtn.style.cssText = 'padding:8px 18px;border-radius:30px;border:none;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;font-weight:bold;cursor:pointer;font-size:14px;font-family:inherit;';
    ctrlBar.appendChild(collapseAllBtn);
    ctrlBar.appendChild(expandAllBtn);
    wrapper.appendChild(ctrlBar);

    // Build root UL
    const rootUl = tempDiv.querySelector('body > ul') || tempDiv.querySelector('ul');
    if (rootUl) {
        const mmRoot = document.createElement('ul');
        mmRoot.className = 'mindmap-root';
        buildMMLevel(rootUl, mmRoot, 0);
        wrapper.appendChild(mmRoot);
    }

    container.appendChild(wrapper);

    // Collapse All
    collapseAllBtn.addEventListener('click', () => {
        wrapper.querySelectorAll('.mindmap-children').forEach(c => c.classList.add('hidden-children'));
        wrapper.querySelectorAll('.mindmap-toggle').forEach(t => t.classList.add('collapsed'));
    });
    // Expand All
    expandAllBtn.addEventListener('click', () => {
        wrapper.querySelectorAll('.mindmap-children').forEach(c => c.classList.remove('hidden-children'));
        wrapper.querySelectorAll('.mindmap-toggle').forEach(t => t.classList.remove('collapsed'));
    });
}

function buildMMLevel(srcUl, destUl, level) {
    Array.from(srcUl.children).forEach(li => {
        if (li.tagName !== 'LI') return;

        const nodeDiv = document.createElement('li');
        nodeDiv.className = `mindmap-node mm-level-${Math.min(level, 5)}`;

        // Get the <p> text (node label)
        const pEl = li.querySelector(':scope > p');
        const label = pEl ? pEl.textContent.trim() : '';

        // Get <pre> notes
        const preEls = Array.from(li.querySelectorAll(':scope > pre'));

        // Get child <ul>
        const childUl = li.querySelector(':scope > ul');

        if (childUl) {
            // Togglable node
            const btn = document.createElement('button');
            btn.className = `mindmap-toggle mm-level-${Math.min(level, 5)}`;
            const arrow = document.createElement('span');
            arrow.className = 'mm-arrow';
            arrow.textContent = '▾';
            btn.appendChild(arrow);
            btn.appendChild(document.createTextNode(' ' + label));
            nodeDiv.appendChild(btn);

            // Notes
            preEls.forEach(pre => {
                const note = document.createElement('div');
                note.className = 'mm-note';
                note.textContent = pre.textContent.trim();
                nodeDiv.appendChild(note);
            });

            // Children
            const childContainer = document.createElement('ul');
            childContainer.className = 'mindmap-children';
            buildMMLevel(childUl, childContainer, level + 1);
            nodeDiv.appendChild(childContainer);

            btn.addEventListener('click', () => {
                const isCollapsed = childContainer.classList.toggle('hidden-children');
                btn.classList.toggle('collapsed', isCollapsed);
            });
        } else {
            // Leaf node
            const leaf = document.createElement('span');
            leaf.className = `mindmap-leaf mm-level-${Math.min(level, 5)}`;
            leaf.textContent = label;
            nodeDiv.appendChild(leaf);

            preEls.forEach(pre => {
                const note = document.createElement('div');
                note.className = 'mm-note';
                note.textContent = pre.textContent.trim();
                nodeDiv.appendChild(note);
            });
        }

        destUl.appendChild(nodeDiv);
    });
}

/* ── Utilities ── */
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function extractGrammarTopic(sentence) {
    const lower = sentence.toLowerCase().trim();
    const topics = {
        'nouns':'NOUNS','noun':'NOUNS','pronouns':'PRONOUNS','pronoun':'PRONOUNS',
        'verbs':'VERBS','verb':'VERBS','adjectives':'ADJECTIVES','adjective':'ADJECTIVES',
        'adverbs':'ADVERBS','adverb':'ADVERBS','prepositions':'PREPOSITIONS','preposition':'PREPOSITIONS',
        'conjunctions':'CONJUNCTIONS','conjunction':'CONJUNCTIONS','interjections':'INTERJECTIONS',
        'interjection':'INTERJECTIONS','tenses':'TENSES','tense':'TENSES','sentences':'SENTENCES',
        'sentence':'SENTENCES','punctuation':'PUNCTUATION'
    };
    for (const [k,v] of Object.entries(topics)) if (lower.includes(k)) return v;
    return sentence.split(' ').pop().toUpperCase().replace(/[^\w]/g,'');
}

function filterTextByLanguage(text, lang) {
    if (typeof text !== 'string' || typeof lang !== 'string') return '';
    const patterns = { or:/[\u0B00-\u0B7F\,.":;!?()\0-9 ]+/g, hi:/[\u0900-\u097F]+/g, en:/[A-Za-z]+/g };
    const key = lang.toLowerCase().slice(0,2);
    if (!patterns[key]) return '';
    return (text.match(patterns[key]) || []).join(' ').trim();
}

/* ── Cache ── */
async function cacheFiles(){
    try{
        const cache=await caches.open(CACHE_NAME);
        const cached=(await cache.keys()).map(r=>r.url);
        const toFetch=STATIC_ASSETS.filter(u=>!cached.includes(u));
        if(toFetch.length>0){
            let loaded=0;
            for(const f of toFetch){
                try{
                    const r=await fetch(f,{cache:'no-cache'});
                    if(!r.ok) throw new Error();
                    await cache.put(f,r.clone());
                    loaded++;
                    showProgress('Caching resources',Math.round((loaded/toFetch.length)*100));
                }catch(e){ console.error('Cache err',f,e); }
            }
            hideProgress();
        }
    }catch(e){ console.error(e); hideProgress(); }
}

async function loadResource(url){
    try{
        const cache=await caches.open(CACHE_NAME);
        const cached=await cache.match(url);
        if(cached) return cached;
        const r=await fetch(url,{cache:'no-cache'});
        if(!r.ok) throw new Error(`fetch failed ${url}`);
        await cache.put(url,r.clone());
        return r;
    }catch(e){
        console.error(e);
        document.getElementById('contentInner').innerHTML='<p>Offline: Resource not cached. Connect to internet first.</p>';
        return null;
    }
}

async function loadImage(url){
    try{
        const cache=await caches.open(CACHE_NAME);
        const cached=await cache.match(url);
        if(cached){ const b=await cached.blob(); return URL.createObjectURL(b); }
        const r=await fetch(url,{cache:'no-cache'});
        if(!r.ok) throw new Error();
        await cache.put(url,r.clone());
        return URL.createObjectURL(await r.blob());
    }catch(e){ return null; }
}

async function initDatabases(){

}

async function searchWord(word, targetEl, suggestionsEl=null, isDictionary=false){
    const tw=trimInput(word);
    if(!tw){ targetEl.innerHTML=''; if(suggestionsEl) suggestionsEl.innerHTML=''; return; }
    let results=[],suggestions=[];
    const deletedImages=getDeletedImages();
    const customWords=JSON.parse(localStorage.getItem('customWords')||'[]');
    results.push(...customWords.filter(w=>w.English.toLowerCase()===tw||(w.odia&&w.odia.toLowerCase()===tw)||(w.hindi&&w.hindi.toLowerCase()===tw)));
    try{
        if(dbEnglishOdia){
            const s=dbEnglishOdia.prepare("SELECT English,odia FROM dictionary WHERE English LIKE ? OR odia LIKE ?");
            s.bind([tw,tw]); while(s.step()){ const r=s.getAsObject(); results.push({English:r.English,odia:r.odia}); } s.free();
        }
        if(dbEnglishHindi){
            const s=dbEnglishHindi.prepare("SELECT English,hindi,image FROM dictionary WHERE English LIKE ? OR hindi LIKE ?");
            s.bind([tw,tw]); while(s.step()){ const r=s.getAsObject(); results.push({English:r.English,hindi:r.hindi,image:r.image}); } s.free();
        }
        const merged=mergeResults(results);
        if(suggestionsEl){
            if(dbEnglishOdia){
                const s=dbEnglishOdia.prepare("SELECT English,odia FROM dictionary WHERE English LIKE ? OR odia LIKE ? LIMIT 5");
                s.bind([`${tw}%`,`${tw}%`]); while(s.step()){ const r=s.getAsObject(); suggestions.push({English:r.English,odia:r.odia}); } s.free();
            }
            if(dbEnglishHindi){
                const s=dbEnglishHindi.prepare("SELECT English,hindi,image FROM dictionary WHERE English LIKE ? OR hindi LIKE ? LIMIT 5");
                s.bind([`${tw}%`,`${tw}%`]); while(s.step()){ const r=s.getAsObject(); suggestions.push({English:r.English,hindi:r.hindi,image:r.image}); } s.free();
            }
            const ms=mergeResults(suggestions);
            suggestionsEl.innerHTML='<ul>'+ms.map(s=>`<li data-english="${escapeHtml(s.English||'')}" data-odia="${escapeHtml(s.odia||'')}" data-hindi="${escapeHtml(s.hindi||'')}">${escapeHtml(s.English||(s.odia||s.hindi))}</li>`).join('')+'</ul>';
        }
        let html='';
        merged.forEach(r=>{
            html+=`<div class="result-item"><div class="result-text">`;
            if(r.English) html+=`<strong>English:</strong> ${escapeHtml(r.English)}<br>`;
            if(r.odia)    html+=`<strong>Odia:</strong> ${escapeHtml(r.odia)}<br>`;
            if(r.hindi)   html+=`<strong>Hindi:</strong> ${escapeHtml(r.hindi)}<br>`;
            html+=`</div>`;
            if(r.image && !deletedImages.includes(r.image)){
                html+=`<div class="image-container">`;
                if(r.image.startsWith('data:')){ html+=`<img src="${r.image}" loading="lazy">`; }
                else{ loadImage(r.image).then(src=>{ if(src){ const el=targetEl.querySelector(`[data-image-placeholder="${r.image}"]`); if(el) el.src=src; } }); html+=`<img data-image-placeholder="${r.image}" src="" loading="lazy">`; }
                html+=`</div><div class="image-controls"><button class="delete-button" data-image="${r.image}" data-word="${escapeHtml(r.English||r.odia||r.hindi)}">Delete</button><button class="restore-button" data-image="${r.image}" data-word="${escapeHtml(r.English||r.odia||r.hindi)}" disabled>Restore</button></div>`;
            }
            html+=`</div>`;
        });
        targetEl.innerHTML=html;
        setupImageControlListeners(targetEl);
    }catch(e){
        console.error(e);
        targetEl.innerHTML='<div class="result-item"><div class="result-text">Error searching.</div></div>';
    }
}

function setupImageControlListeners(el){
    el.querySelectorAll('.delete-button').forEach(btn=>{
        btn.addEventListener('click',()=>{
            const u=btn.getAttribute('data-image');
            const ctrl=btn.closest('.image-controls');
            const cont=ctrl.previousElementSibling;
            saveDeletedImage(u);
            cont.querySelector('img')?.remove();
            let p=cont.querySelector('p'); if(!p){p=document.createElement('p');cont.appendChild(p);}
            p.textContent='Image hidden'; btn.textContent='Hidden'; btn.disabled=true;
            ctrl.querySelector('.restore-button').disabled=false;
        });
    });
    el.querySelectorAll('.restore-button').forEach(btn=>{
        btn.addEventListener('click',async()=>{
            const u=btn.getAttribute('data-image'),w=btn.getAttribute('data-word');
            const pwd=prompt('Enter the word to restore image:');
            if(pwd&&pwd.toLowerCase()===w.toLowerCase()){
                removeDeletedImage(u);
                const ctrl=btn.closest('.image-controls'),cont=ctrl.previousElementSibling;
                cont.querySelector('p')?.remove();
                const src=u.startsWith('data:')?u:await loadImage(u);
                if(src){ const img=document.createElement('img'); img.src=src; img.loading='lazy'; cont.appendChild(img); ctrl.querySelector('.restore-button').disabled=true; ctrl.querySelector('.delete-button').disabled=false; ctrl.querySelector('.delete-button').textContent='Delete'; }
                else alert('Image not available offline.');
            }else alert('Incorrect word.');
        });
    });
}

function getFirstOdiaWord(){

        const s=dbEnglishOdia.prepare("SELECT odia FROM dictionary ORDER BY odia ASC LIMIT 1");
        if(s.step()){ const r=s.getAsObject(); s.free(); return r.odia; }
        s.free(); return null;
    }catch(e){ return null; }
}

/* ── MCQ Parsing ── */
function parseChapterToSubjects(lines,lang,chapterName=''){
    const subjects=new Map(); let curSubj=null,curMcqs=[],i=0;
    const numRe=/^[0-9\u0B66-\u0B6F]+\.\s*/,oneRe=/^1\.\s*/,odiaOneRe=/^୧\.\s*/;
    const optRe=lang==='english'?/^([a-e]\)|\([1-5]\)|[1-5]\.)\s*/i:/^([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)\s*/;
    const ansRe=lang==='english'?/^Answer:\s*([a-e]\)|\([1-5]\)|[1-5]\.)/i:/^ଉତ୍ତର:\s*([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)/;
    const isEG=lang==='english'&&chapterName.toLowerCase().includes('grammar');
    while(i<lines.length){
        while(i<lines.length&&!lines[i].trim())i++;
        if(i>=lines.length) break;
        const line=lines[i].trim(),isNum=numRe.test(line),isOne=oneRe.test(line)||odiaOneRe.test(line);
        if(!isNum){
            let j=i+1; while(j<lines.length&&!lines[j].trim())j++;
            if(j<lines.length&&(oneRe.test(lines[j].trim())||odiaOneRe.test(lines[j].trim()))){
                if(curSubj&&curMcqs.length>0){subjects.set(curSubj,[...curMcqs]);curMcqs=[];}
                curSubj=isEG?extractGrammarTopic(line):line; i=j; continue;
            }
            i++; continue;
        }else{
            if(!curSubj) curSubj=isEG?'GENERAL GRAMMAR':'General';
            let qLines=[lines[i]]; i++;
            while(i<lines.length){ while(i<lines.length&&!lines[i].trim())i++; if(i>=lines.length) break; if(optRe.test(lines[i].trim())) break; qLines.push(lines[i]); i++; }
            let opts=[];
            while(i<lines.length){ while(i<lines.length&&!lines[i].trim())i++; if(i>=lines.length) break; if(optRe.test(lines[i].trim())){opts.push(lines[i]);i++;}else break; }
            let ans=null; while(i<lines.length&&!lines[i].trim())i++;
            if(i<lines.length&&ansRe.test(lines[i].trim())){ans=lines[i];i++;}
            if(opts.length>=4&&ans&&curSubj) curMcqs.push({question:qLines.join('\n'),options:opts,answer:ans});
        }
    }
    if(curSubj&&curMcqs.length>0) subjects.set(curSubj,curMcqs);
    return subjects;
}

function parseMCQs(allLines,lang){
    const questions=[],remaining=[]; let i=0;
    const optRe=lang==='english'?/^([a-e]\)|\([1-5]\)|[1-5]\.)\s*/i:/^([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)\s*/;
    const ansRe=lang==='english'?/^Answer:\s*([a-e]\)|\([1-5]\)|[1-5]\.)/i:/^ଉତ୍ତର:\s*([କ-ଙ]\)|\([୧-୫]\)|[୧-୫]\.)/;
    while(i<allLines.length){
        while(i<allLines.length&&!allLines[i].trim())i++;
        if(i>=allLines.length) break;
        let q=[];
        while(i<allLines.length){ const l=allLines[i].trim(); if(optRe.test(l)||ansRe.test(l)) break; q.push(allLines[i]); i++; }
        if(!q.length){remaining.push(allLines[i]);i++;continue;}
        let optStart=i,opts=[];
        while(i<allLines.length){ while(i<allLines.length&&!allLines[i].trim())i++; if(i>=allLines.length) break; if(optRe.test(allLines[i].trim())){opts.push(allLines[i]);i++;}else break; }
        if(opts.length<4){remaining.push(...q,...allLines.slice(optStart,i));continue;}
        while(i<allLines.length&&!allLines[i].trim())i++;
        if(i<allLines.length&&ansRe.test(allLines[i].trim())){
            questions.push({question:q.join('\n'),options:opts,answer:allLines[i]});i++;
        }else{remaining.push(...q,...opts);}
    }
    remaining.push(...allLines.slice(i));
    return {questions,remainingLines:remaining};
}

function setupMCQListeners(lang){
    document.querySelectorAll('.option-btn').forEach(btn=>{
        btn.addEventListener('click',function(){
            const md=this.closest('.mcq'),opts=md.querySelectorAll('.option-btn'),ansDiv=md.querySelector('.answer'),fbDiv=md.querySelector('.feedback'),skipBtn=md.querySelector('.skip-btn');
            opts.forEach(b=>b.disabled=true); skipBtn.disabled=true;
            const ansStr=md.dataset.answer,lbRe=lang==='english'?/Answer:\s*(\(?[a-e1-5]\)?\.?)/i:/ଉତ୍ତର:\s*(\(?[କ-ଙ୧-୫]\)?\.?)/;
            const match=ansStr.match(lbRe),correctLabel=match?match[1]:null;
            if(!correctLabel) return;
            let correctIdx=-1;
            opts.forEach((b,i)=>{ const m=b.textContent.trim().match(lang==='english'?/^(\(?[a-e1-5]\)?\.?)/:/ ^(\(?[କ-ଙ୧-୫]\)?\.?)/); if(m&&m[1]===correctLabel) correctIdx=i; });
            const myIdx=parseInt(this.dataset.oidx);
            let msg,myColor='#f44336';
            if(myIdx===correctIdx){currentScore++;msg='✓ Correct!';myColor='#4caf50';}
            else{msg='✗ Wrong';if(opts[correctIdx]){opts[correctIdx].style.backgroundColor='#4caf50';opts[correctIdx].style.color='white';}}
            this.style.backgroundColor=myColor; this.style.color='white';
            fbDiv.textContent=msg; fbDiv.style.display='block'; fbDiv.style.cssText=`font-weight:bold;color:${myColor==='#4caf50'?'#2e7d32':'#d32f2f'};margin:10px 0;padding:5px;`;
            ansDiv.style.display='block'; speakFeedback(msg);
            currentAttempted++;
            document.getElementById('attempted-count').textContent=currentAttempted;
            document.getElementById('score-count').textContent=currentScore;
            if(currentAttempted===currentBatchSize) setTimeout(showResultsPopUp,1000);
        });
    });
    document.querySelectorAll('.skip-btn').forEach(btn=>{
        btn.addEventListener('click',function(){
            const md=this.closest('.mcq');
            md.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
            this.disabled=true; this.style.backgroundColor='#ccc';
            md.querySelector('.feedback').textContent='Skipped'; md.querySelector('.feedback').style.color='#ff9800'; md.querySelector('.feedback').style.display='block';
            md.querySelector('.answer').style.display='block';
            currentAttempted++;
            document.getElementById('attempted-count').textContent=currentAttempted;
            document.getElementById('score-count').textContent=currentScore;
            if(currentAttempted===currentBatchSize) setTimeout(showResultsPopUp,1000);
        });
    });
}

/* ── TTS ── */
function isMCQContent(){ return !!document.getElementById('contentInner').querySelector('.mcq'); }
function updateTTSVisibility(){
    const show=isTTSSupported&&(sentences.length>0||isMCQContent());
    document.getElementById('voiceButton').disabled=!show;
    document.getElementById('stopButton').disabled=!show;
    // Always keep tts-bar visible in reader, just disable buttons when not applicable
    document.getElementById('processing-status').textContent='';
}

function populateVoiceList(){
    if(!isTTSSupported) return;
    voices=window.speechSynthesis.getVoices();
    defaultEnglishVoice=voices.find(v=>v.lang.startsWith('en')&&v.name.includes('Google'))||voices.find(v=>v.lang.startsWith('en'));
    defaultHindiVoice=voices.find(v=>v.lang.startsWith('hi')&&v.name.includes('Google'))||voices.find(v=>v.lang.startsWith('hi'));
    defaultOdiaVoice=voices.find(v=>v.lang.startsWith('or')&&v.name.includes('Google'))||voices.find(v=>v.lang.startsWith('or'));
}

function speakFeedback(msg){
    if(isReadingAloud&&isMCQContent()) return;
    if(!isTTSSupported||!defaultEnglishVoice) return;
    const u=new SpeechSynthesisUtterance(msg); u.voice=defaultEnglishVoice; u.lang='en-US'; u.rate=0.8; u.pitch=1; u.volume=1;
    window.speechSynthesis.speak(u);
}

function playSpeech(){
    if(!isTTSSupported||(!isMCQContent()&&sentences.length===0)){updateTTSVisibility();return;}
    if(isReadingAloud&&isPaused){window.speechSynthesis.resume();isPaused=false;document.getElementById('voiceButton').textContent='⏸️ Pause';return;}
    if(isReadingAloud){window.speechSynthesis.pause();isPaused=true;document.getElementById('voiceButton').textContent='▶️ Resume';return;}
    stopSpeech(); isReadingAloud=true; isPaused=false; document.getElementById('voiceButton').textContent='⏸️ Pause';
    if(isMCQContent()){document.getElementById('processing-status').textContent='Reading MCQs...';readNextMCQ();}
    else{currentSentenceIndex=lastTappedSentenceIndex>=0?lastTappedSentenceIndex:(currentSentenceIndex>=sentences.length-1?0:currentSentenceIndex+1);readNextSentence();}
}

function speakWithCallback(text,cb){
    if(!isReadingAloud) return;
    speechUtterances=[]; activeUtterances=0;
    const vm={hi:defaultHindiVoice,or:defaultOdiaVoice,en:defaultEnglishVoice};
    ['hi','or','en'].forEach(lp=>{
        const ft=filterTextByLanguage(text,lp); if(!ft) return;
        const v=vm[lp]; if(!v) return;
        const u=new SpeechSynthesisUtterance(ft); u.voice=v; u.lang=v.lang; u.rate=0.7; u.volume=4;
        u.onend=()=>{activeUtterances--;if(activeUtterances===0&&isReadingAloud) setTimeout(cb,500);};
        speechUtterances.push(u); activeUtterances++;
    });
    if(activeUtterances>0) speechUtterances.forEach(u=>window.speechSynthesis.speak(u));
    else{ const fu=new SpeechSynthesisUtterance(text); fu.voice=defaultEnglishVoice||defaultOdiaVoice; fu.rate=0.7; fu.onend=()=>{if(isReadingAloud)setTimeout(cb,500);}; window.speechSynthesis.speak(fu); speechUtterances.push(fu); }
}

function readNextMCQ(){
    const mcqs=document.querySelectorAll('.mcq');
    if(currentMcqIndex>=mcqs.length||!isReadingAloud){stopSpeech();return;}
    const md=mcqs[currentMcqIndex]; md.scrollIntoView({behavior:'smooth',block:'center'});
    const qDiv=md.querySelector('.question-text'),optsDiv=md.querySelector('.options'),ansDiv=md.querySelector('.answer');
    const optBtns=Array.from(md.querySelectorAll('.option-btn'));
    const qText=qDiv.textContent,optText=optBtns.map(b=>b.textContent).join('. ');
    const ansStr=md.dataset.answer||ansDiv.textContent;
    let clm=ansStr.match(/Answer:\s*(\(?[a-eA-E1-5]\)?\.?)/i)||ansStr.match(/ଉତ୍ତର:\s*(\(?[କ-ଙ୧-୫]\)?\.?)/);
    let cl=clm?clm[1]:null,ci2=-1;
    optBtns.forEach((b,i)=>{ const m=b.textContent.trim().match(/^(\(?[a-eA-E1-5]\)?\.?)/)||b.textContent.trim().match(/^(\(?[କ-ଙ୧-୫]\)?\.?)/); if(m&&m[1]===cl) ci2=i; });
    if(ci2===-1){ const ac=ansStr.replace(/Answer:|ଉତ୍ତର:/ig,'').trim(); ci2=optBtns.findIndex(b=>b.textContent.includes(ac)||ac.includes(b.textContent)); if(ci2===-1) ci2=0; }
    const correctBtn=optBtns[ci2],ansSpeech=' '+correctBtn.textContent;
    qDiv.style.backgroundColor='#ffff99';
    speakWithCallback(qText,()=>{
        qDiv.style.backgroundColor='';
        if(!isReadingAloud) return;
        optsDiv.style.backgroundColor='#e0f7fa';
        speakWithCallback(' '+optText,()=>{
            optsDiv.style.backgroundColor='';
            if(!isReadingAloud) return;
            if(!correctBtn.disabled) correctBtn.click();
            ansDiv.style.backgroundColor='#c8e6c9';
            speakWithCallback(ansSpeech,()=>{
                ansDiv.style.backgroundColor='#e3f2fd';
                if(!isReadingAloud) return;
                currentMcqIndex++; readNextMCQ();
            });
        });
    });
}

function readNextSentence(){
    if(!isTTSSupported||isMCQContent()||sentences.length===0){updateTTSVisibility();return;}
    while(currentSentenceIndex<sentences.length&&!sentences[currentSentenceIndex].trim()) currentSentenceIndex++;
    if(currentSentenceIndex>=sentences.length||!isReadingAloud){
        stopSpeech();
        if(currentSentenceIndex>=sentences.length&&lastTappedFile){clearLastTappedPosition(lastTappedFile);lastTappedSentenceIndex=-1;}
        return;
    }
    const text=sentences[currentSentenceIndex];
    const spans=document.getElementById('contentInner').querySelectorAll('span[data-sentence-index]');
    spans.forEach(s=>s.classList.remove('highlight'));
    const cs=Array.from(spans).find(s=>parseInt(s.getAttribute('data-sentence-index'))===currentSentenceIndex);
    if(cs){ cs.classList.add('highlight'); const ci=document.getElementById('contentInner'),sr=cs.getBoundingClientRect(),cr=ci.getBoundingClientRect(); ci.scrollTop+=sr.top-cr.top-(cr.height/2)+(sr.height/2); }
    speechUtterances=[]; activeUtterances=0;
    const vm={hi:defaultHindiVoice,or:defaultOdiaVoice,en:defaultEnglishVoice};
    ['hi','or','en'].forEach(lp=>{
        const ft=filterTextByLanguage(text,lp); if(!ft) return;
        const v=vm[lp]; if(!v) return;
        const u=new SpeechSynthesisUtterance(ft); u.voice=v; u.lang=v.lang; u.rate=0.7; u.pitch=1; u.volume=4;
        u.onend=()=>{activeUtterances--;if(activeUtterances===0&&isReadingAloud){currentSentenceIndex++;if(lastTappedFile)saveLastTappedPosition(lastTappedFile,currentSentenceIndex,0);readNextSentence();}};
        speechUtterances.push(u); activeUtterances++;
    });
    if(activeUtterances>0){speechUtterances.forEach(u=>window.speechSynthesis.speak(u));document.getElementById('voiceButton').disabled=false;document.getElementById('stopButton').disabled=false;}
    else{currentSentenceIndex++;if(lastTappedFile)saveLastTappedPosition(lastTappedFile,currentSentenceIndex,0);readNextSentence();}
}

function stopSpeech(){
    if(isTTSSupported) window.speechSynthesis.cancel();
    speechUtterances=[]; activeUtterances=0; isReadingAloud=false; isPaused=false; isDictionaryReading=false;
    document.getElementById('voiceButton').textContent='🗣️ Speak';
    document.getElementById('stopButton').disabled=true;
    document.getElementById('contentInner').querySelectorAll('span[data-sentence-index]').forEach(s=>{s.classList.remove('highlight');s.style.display='inline';});
    document.querySelectorAll('.mcq .question-text,.mcq .options,.mcq .answer').forEach(el=>{el.style.backgroundColor=el.classList.contains('answer')?'#e3f2fd':'';});
    updateTTSVisibility();
}

/* ── Text Selection → Popup ── */
function setupInteractionListeners(){
    const ci=document.getElementById('contentInner');
    ci.addEventListener('mouseup',handleTextSelection);
    ci.addEventListener('touchend',handleTextSelection);
}

function handleTextSelection(e){
    if(!document.getElementById('contentArea').classList.contains('active')) return;
    const sel=window.getSelection(),txt=sel.toString().trim();
    if(txt){
        const range=sel.getRangeAt(0),el=range.startContainer.parentElement.closest('span[data-sentence-index]');
        if(el){ lastTappedSentenceIndex=parseInt(el.getAttribute('data-sentence-index'),10); if(lastTappedFile) saveLastTappedPosition(lastTappedFile,lastTappedSentenceIndex,0); }
        const words=txt.split(/\s+/).filter(w=>w.match(/[A-Za-z\u0B00-\u0B7F]/));
        if(words.length>0) showPopup(words[0].replace(/[^A-Za-z\u0B00-\u0B7F]/g,'').trim());
        sel.removeAllRanges();
    }
}

/* ── Load Content ── */
async function loadContent(sectionIndex, chapterIndex){
    const chapter = sections[sectionIndex].chapters[chapterIndex];
    if(chapter.type === 'link'){ window.open(chapter.url, '_blank'); return; }
    
    const contentArea = document.getElementById('contentArea');
    const ci = document.getElementById('contentInner');
    const cc = document.getElementById('chapterContainer');
    
    ci.innerHTML = ''; 
    lastTappedFile = chapter.url; 
    lastTappedSentenceIndex = -1; 
    currentMcqIndex = 0; 
    sentences = [];
    document.getElementById('readerChapterName').textContent = chapter.name;
    
    const content = await loadResource(chapter.url);
    if(!content){
        ci.innerHTML = '<p>Offline: Content not cached.</p>';
        contentArea.classList.add('active'); 
        cc.classList.add('hidden'); 
        return;
    }
    
    const textContent = await content.text();
    
    if(chapter.type === 'html'){
        // Check if it's a mind map style HTML
        if(isMindMapHtml(textContent)){
            ci.innerHTML = '';
            buildMindMap(ci, textContent);
            ci.classList.remove('content-text');
            sentences = [];
        } else {
            const tempDiv = document.createElement('div');
            if(sectionIndex === 2) tempDiv.style.whiteSpace = 'pre'; else tempDiv.style.whiteSpace = 'pre-wrap';
            tempDiv.innerHTML = textContent;
            
            const processNode = (node) => {
                if(node.nodeType === 3){
                    const tc = node.textContent, words = tc.split(/(\s+)/), frag = document.createDocumentFragment(), si = sentences.length;
                    words.forEach(w => {
                        if(w.match(/\s+/)){ frag.appendChild(document.createTextNode(w)); }
                        else if(w.match(/[A-Za-z\u0B00-\u0B7F]/)){
                            const sp = document.createElement('span');
                            sp.setAttribute('data-word', w.replace(/[^A-Za-z\u0B00-\u0B7F]/g, ''));
                            sp.setAttribute('data-sentence-index', si);
                            sp.textContent = w;
                            frag.appendChild(sp);
                        } else { frag.appendChild(document.createTextNode(w)); }
                    });
                    sentences.push(tc.trim()); 
                    node.parentNode.replaceChild(frag, node);
                } else if(node.nodeType === 1) { node.childNodes.forEach(processNode); }
            };
            tempDiv.childNodes.forEach(processNode);
            ci.appendChild(tempDiv); 
            ci.classList.remove('content-text');
        }
    } else if (chapter.type === 'text') {
        const isTheory = chapter.name.includes('Theory');
        const isEnglishGrammar = chapter.name.includes('English Grammar');
        const isComputer = chapter.name.includes('Computer');

        // Apply ### subject ### logic to Theory, English Grammar, and Computer
        if (isTheory || isEnglishGrammar || isComputer) {
            let pages = [];
            const rx = /###\s*(.*?)\s*###([\s\S]*?)(?=###|$)/g; 
            let m;
            while((m = rx.exec(textContent)) !== null) {
                pages.push({name: m[1].trim(), content: m[2].trim()});
            }
            
            // Fallback if no ### markers are found in the text
            if(!pages.length) pages = [{name: chapter.name, content: textContent}];

            // If it's English Grammar or Computer, load them as Subject-Wise Mock Tests
            if (isEnglishGrammar || isComputer) {
                const subjects = new Map();
                pages.forEach(p => {
                    const {questions} = parseMCQs(p.content.split(/\r?\n/), sections[sectionIndex].language);
                    if(questions.length > 0) subjects.set(p.name, questions);
                });

                if(subjects.size > 0){
                    currentSubjectsMap = subjects; 
                    currentChapterName = chapter.name;
                    let html = `<div class="section"><h1 class="section-title">${escapeHtml(chapter.name)} – Subjects</h1><ul class="chapter-list">`;
                    for(let sn of subjects.keys()){
                        html += `<li class="chapter-item" data-subject="${escapeHtml(sn)}">${escapeHtml(sn)}</li>`;
                    }
                    html += '</ul></div>';
                    ci.innerHTML = html; 
                    ci.classList.add('content-text');
                    ci.querySelectorAll('.chapter-item').forEach(li => 
                        li.addEventListener('click', e => loadSubjectSets(sectionIndex, chapterIndex, e.target.dataset.subject))
                    );
                    sentences = [];
                } else {
                    // Fallback to text reader if no MCQs are parsed correctly
                    loadPageList(sectionIndex, chapterIndex, pages);
                }
            } else {
                // GK Theory - Show subject menu. Clicking loads ONLY that subject's text.
                loadPageList(sectionIndex, chapterIndex, pages);
            }
            
        } else {
            // Normal fallback for standard Chapter-Wise Mock Tests
            const allLines = textContent.split(/\r?\n/), lang = sections[sectionIndex].language;
            const subjects = parseChapterToSubjects(allLines, lang, chapter.name);
            currentSubjectsMap = subjects; 
            currentChapterName = chapter.name;
            
            let html = `<div class="section"><h1 class="section-title">${escapeHtml(chapter.name)} – Subjects</h1><ul class="chapter-list">`;
            let hasSub = false;
            
            for(let [sn, ml] of subjects){
                if(ml.length > 0){
                    html += `<li class="chapter-item" data-subject="${escapeHtml(sn)}">${escapeHtml(sn)}</li>`;
                    hasSub = true;
                }
            }
            
            if (hasSub) {
                html += '</ul></div>'; 
                ci.innerHTML = html; 
                ci.classList.add('content-text');
                ci.querySelectorAll('.chapter-item').forEach(li => 
                    li.addEventListener('click', e => loadSubjectSets(sectionIndex, chapterIndex, e.target.dataset.subject))
                );
                sentences = [];
            } else {
                const {questions, remainingLines} = parseMCQs(allLines, lang);
                let mh = '';
                questions.forEach(q => {
                    mh += `<div class="mcq" data-answer="${escapeHtml(q.answer.replace(/"/g,'&quot;'))}"><div class="question-text">${escapeHtml(q.question).replace(/\n/g,'<br>')}</div><div class="options">`;
                    q.options.forEach((o, oi) => mh += `<button class="option-btn" data-oidx="${oi}">${escapeHtml(o)}</button><br>`);
                    mh += `</div><button class="skip-btn">Skip</button><br><div class="answer" style="display:none;">${escapeHtml(q.answer)}</div><div class="feedback" style="display:none;"></div></div><hr style="margin:20px 0;">`;
                });
                
                let rh = '';
                remainingLines.forEach((l, i) => {
                    if(questions.length > 0) rh += `<span>${escapeHtml(l)}</span><br>`;
                    else rh += `<span data-sentence-index="${i}">${escapeHtml(l)}</span><br>`;
                });
                
                ci.innerHTML = mh + rh; 
                ci.classList.add('content-text');
                if(questions.length > 0){ setupMCQListeners(lang); sentences = []; }
                else { sentences = remainingLines; }
            }
        }
    }
    
    contentArea.classList.add('active'); 
    cc.classList.add('hidden');
    
    const saved = loadLastTappedPosition(chapter.url);
    currentSentenceIndex = saved ? saved.sentenceIndex : -1; 
    lastTappedSentenceIndex = currentSentenceIndex;
    
    setupInteractionListeners(); 
    updateTTSVisibility();
}


/* ── File Upload ── */
async function handleFileUpload(event){
    const files=Array.from(event.target.files);
    if(!files.length) return;
    const ci=document.getElementById('contentInner'),ca=document.getElementById('contentArea'),cc=document.getElementById('chapterContainer');
    stopSpeech(); ci.innerHTML=''; lastTappedFile=files[0].name; lastTappedSentenceIndex=-1; sentences=[]; currentMcqIndex=0;
    document.getElementById('readerChapterName').textContent=files[0].name;
    const pdfs=files.filter(f=>f.name.endsWith('.pdf')),txts=files.filter(f=>f.name.endsWith('.txt')||f.name.endsWith('.html'));
    try{
        if(pdfs.length>0){
            showProgress('Processing PDFs',0);
            let tot='';
            for(let i=0;i<pdfs.length;i++){
                const ab=await pdfs[i].arrayBuffer(),pdf=await pdfjsLib.getDocument({data:ab}).promise;
                let t='';
                for(let j=1;j<=pdf.numPages;j++){const pg=await pdf.getPage(j);const tc=await pg.getTextContent();t+=tc.items.map(x=>x.str).join(' ')+'\n';showProgress('Processing PDFs',Math.round(((j/pdf.numPages)*(100/pdfs.length))+(i*(100/pdfs.length))));}
                tot+=t+'\n';
            }
            const lines=tot.split(/\r?\n/),lang='english',{questions,remainingLines}=parseMCQs(lines,lang);
            let html='';
            questions.forEach(q=>{html+=`<div class="mcq" data-answer="${escapeHtml(q.answer.replace(/"/g,'&quot;'))}"><div class="question-text">${escapeHtml(q.question).replace(/\n/g,'<br>')}</div><div class="options">`;q.options.forEach((o,oi)=>html+=`<button class="option-btn" data-oidx="${oi}">${escapeHtml(o)}</button><br>`);html+=`</div><button class="skip-btn">Skip</button><br><div class="answer" style="display:none;">${escapeHtml(q.answer)}</div><div class="feedback" style="display:none;"></div></div><hr style="margin:20px 0;">`});
            remainingLines.forEach(l=>html+=`<span>${escapeHtml(l)}</span><br>`);
            ci.innerHTML+=html; ci.classList.add('content-text');
            if(questions.length>0) setupMCQListeners(lang); else sentences=remainingLines;
            hideProgress();
        }
        if(txts.length>0){
            showProgress('Processing files',0);
            for(let i=0;i<txts.length;i++){
                const file=txts[i]; let fh='';
                if(file.name.endsWith('.txt')){
                    const text=await file.text(),lines=text.split(/\r?\n/),lang='english';
                    const subj=parseChapterToSubjects(lines,lang,file.name);
                    if(subj.size>0){
                        currentSubjectsMap=subj; fh+=`<div class="section"><h1 class="section-title">Subjects</h1><ul class="chapter-list">`;
                        for(let [sn,ml] of subj) if(ml.length>0) fh+=`<li class="chapter-item" data-subject="${escapeHtml(sn)}">${escapeHtml(sn)}</li>`;
                        fh+='</ul></div>'; ci.innerHTML+=fh; ci.querySelectorAll('.chapter-item').forEach(li=>li.addEventListener('click',e=>loadSubjectSets(0,0,e.target.dataset.subject)));
                        ci.classList.add('content-text'); sentences=[];
                    }else{
                        const {questions,remainingLines}=parseMCQs(lines,lang);
                        if(questions.length>0){
                            questions.forEach(q=>{fh+=`<div class="mcq" data-answer="${escapeHtml(q.answer.replace(/"/g,'&quot;'))}"><div class="question-text">${escapeHtml(q.question).replace(/\n/g,'<br>')}</div><div class="options">`;q.options.forEach((o,oi)=>fh+=`<button class="option-btn" data-oidx="${oi}">${escapeHtml(o)}</button><br>`);fh+=`</div><button class="skip-btn">Skip</button><br><div class="answer" style="display:none;">${escapeHtml(q.answer)}</div><div class="feedback" style="display:none;"></div></div><hr style="margin:20px 0;">`});
                            remainingLines.forEach(l=>fh+=`<span>${escapeHtml(l)}</span><br>`);
                            setupMCQListeners(lang); sentences=[];
                        }else{
                            remainingLines.forEach((l,idx)=>fh+=`<span data-sentence-index="${sentences.length+idx}">${escapeHtml(l)}</span><br>`);
                            sentences=sentences.concat(remainingLines);
                        }
                        ci.innerHTML+=fh; ci.classList.add('content-text');
                    }
                }else{
                    const text=await file.text();
                    if(isMindMapHtml(text)){
                        ci.innerHTML='';
                        buildMindMap(ci, text);
                        ci.classList.remove('content-text');
                        sentences=[];
                    } else {
                        const tempDiv=document.createElement('div');
                        tempDiv.innerHTML=text;
                        const processNode=(node)=>{
                            if(node.nodeType===3){const tc=node.textContent,words=tc.split(/(\s+)/),frag=document.createDocumentFragment(),si=sentences.length;words.forEach(w=>{if(w.match(/\s+/))frag.appendChild(document.createTextNode(w));else if(w.match(/[A-Za-z\u0B00-\u0B7F]/)){const sp=document.createElement('span');sp.setAttribute('data-word',w.replace(/[^A-Za-z\u0B00-\u0B7F]/g,''));sp.setAttribute('data-sentence-index',si);sp.textContent=w;frag.appendChild(sp);}else frag.appendChild(document.createTextNode(w));});sentences.push(tc.trim());node.parentNode.replaceChild(frag,node);}else if(node.nodeType===1)node.childNodes.forEach(processNode);
                        };
                        tempDiv.childNodes.forEach(processNode); ci.appendChild(tempDiv); ci.classList.remove('content-text');
                    }
                }
                showProgress('Processing files',Math.round(((i+1)/txts.length)*100));
            }
            hideProgress();
        }
        const saved=loadLastTappedPosition(lastTappedFile);
        currentSentenceIndex=saved?saved.sentenceIndex:-1; lastTappedSentenceIndex=currentSentenceIndex;
        ca.classList.add('active'); cc.classList.add('hidden');
        setupInteractionListeners(); updateTTSVisibility();
    }catch(e){ console.error(e); ci.innerHTML='<p>Error processing file.</p>'; hideProgress(); updateTTSVisibility(); }
}

/* ── Build Chapter Grid ── */
const sectionsContainer=document.getElementById('sections');
sections.forEach((section,si)=>{
    const div=document.createElement('div'); div.className='section'; div.id=`section-${si}`;
    const title=document.createElement('h2'); title.className='section-title'; title.textContent=section.title;
    div.appendChild(title);
    const ul=document.createElement('ul'); ul.className='chapter-list';
    section.chapters.forEach((ch,ci2)=>{
        const li=document.createElement('li'); li.className='chapter-item'; li.id=`chapter-${si}-${ci2}`; li.textContent=ch.name;
        li.addEventListener('click',()=>{ currentSectionIndex=si; currentChapterIndex=ci2; loadContent(si,ci2); });
        ul.appendChild(li);
    });
    div.appendChild(ul); sectionsContainer.appendChild(div);
});

/* ── Init ── */
async function init(){
    showProgress('Initializing',0);
    await cacheFiles();
    showProgress('Loading databases',50);
    await initDatabases();
    showProgress('Ready',100);
    populateVoiceList();
    if(isTTSSupported) window.speechSynthesis.onvoiceschanged=populateVoiceList;

    document.getElementById('fileUpload').addEventListener('change',handleFileUpload);

    document.getElementById('voiceButton').addEventListener('click',playSpeech);
    document.getElementById('stopButton').addEventListener('click',stopSpeech);

    document.getElementById('homeButton').addEventListener('click',()=>{
        stopSpeech();
        document.getElementById('contentArea').classList.remove('active');
        document.getElementById('chapterContainer').classList.remove('hidden');
        document.getElementById('contentInner').innerHTML='';
        document.getElementById('fileUpload').value='';
        sentences=[]; currentSentenceIndex=-1; currentMcqIndex=0;
        lastTappedSentenceIndex=-1; lastTappedFile=null;
        currentSubjectsMap=null; currentChapterName=''; currentSubjectName='';
        updateTTSVisibility();
        if(currentSectionIndex!==null&&currentChapterIndex!==null){
            const se=document.getElementById(`section-${currentSectionIndex}`),ce=document.getElementById(`chapter-${currentSectionIndex}-${currentChapterIndex}`);
            if(se&&ce){se.scrollIntoView({behavior:'smooth',block:'start'});ce.classList.add('highlight');setTimeout(()=>ce.classList.remove('highlight'),2000);}
        }
    });

    document.getElementById('popupClose').addEventListener('click',()=>{
        const p=document.getElementById('popup'); p.classList.remove('visible');
        setTimeout(()=>{p.style.display='none';document.getElementById('popupContent').innerHTML='';},200);
    });

    if('serviceWorker' in navigator){
        navigator.serviceWorker.register('/service-worker.js').catch(e=>console.log('SW:',e));
    }
}

window.addEventListener('load',init);
</script>
