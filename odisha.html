<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Odisha GK Mock Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=DM+Sans:wght@300;400;500;600;700&display=swap');
:root{--saffron:#FF6B35;--gold:#F5A623;--dark:#0D1117;--card:#1C2333;--border:#2D3748;--success:#22C55E;--error:#EF4444;--text:#E2E8F0;--muted:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}
#homeScreen{padding:2rem;max-width:1100px;margin:0 auto}
.logo{font-family:'Tiro Devanagari Sanskrit',serif;font-size:2.5rem;color:var(--saffron);text-align:center;padding:2rem 0 .5rem}
.subtitle{text-align:center;color:var(--muted);margin-bottom:2.5rem;font-size:.9rem}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.chapter-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem 1.5rem;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.chapter-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--saffron),var(--gold))}
.chapter-card:hover{border-color:var(--saffron);transform:translateY(-3px);box-shadow:0 8px 30px #FF6B3520}
.ch-num{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.ch-name{font-size:.92rem;font-weight:600;margin:.3rem 0 .5rem;line-height:1.3}
.ch-meta{font-size:.78rem;color:var(--muted)}
.ch-badge{display:inline-block;padding:.2rem .55rem;border-radius:6px;font-size:.7rem;font-weight:700;background:#FF6B3522;color:var(--saffron);margin-top:.5rem}
#quizScreen{display:none;min-height:100vh;padding:2rem;max-width:780px;margin:0 auto}
.qhdr{text-align:center;margin-bottom:1.5rem}
.quiz-chapter{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.25rem;color:var(--saffron);margin-bottom:.5rem}
.pb-wrap{background:var(--border);border-radius:99px;height:5px;margin:.75rem 0}
.pb-fill{height:5px;border-radius:99px;background:linear-gradient(90deg,var(--saffron),var(--gold));transition:width .4s}
.pt{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.sc2{color:var(--gold);font-weight:600}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.75rem;margin-bottom:1.25rem}
.qn{font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:.6rem}
.qt{font-size:1rem;font-weight:500;line-height:1.6;margin-bottom:.75rem}
.q-table{width:100%;border-collapse:collapse;margin-bottom:1.1rem;font-size:.86rem}
.q-table th{background:#ffffff10;padding:.45rem .7rem;text-align:left;font-weight:700;color:var(--gold);border-bottom:1px solid var(--border)}
.q-table td{padding:.38rem .7rem;border-bottom:1px solid #ffffff08;color:var(--text)}
.opts{display:flex;flex-direction:column;gap:.65rem}
.opt{display:flex;align-items:flex-start;gap:.65rem;padding:.8rem 1rem;border-radius:11px;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;background:#ffffff05}
.opt:hover:not(.lk){border-color:var(--saffron);background:#FF6B3510}
.ol{min-width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px}
.ot{font-size:.9rem;line-height:1.4;font-family:monospace}
.opt.correct{border-color:var(--success);background:#22C55E18}.opt.correct .ol{background:var(--success);color:#fff}
.opt.wrong{border-color:var(--error);background:#EF444418}.opt.wrong .ol{background:var(--error);color:#fff}
.opt.lk{cursor:default}
.expl{background:#ffffff08;border-left:3px solid var(--gold);border-radius:0 9px 9px 0;padding:.7rem .9rem;font-size:.83rem;color:var(--muted);margin-top:.75rem;display:none}
.qnav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-top:.75rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.5rem;border-radius:11px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;transition:all .2s}
.bp{background:linear-gradient(135deg,var(--saffron),#e55a2a);color:#fff}.bp:hover{transform:translateY(-1px)}
.bs{background:var(--card);color:var(--text);border:1px solid var(--border)}.bs:hover{background:#2D3748}
#resultsScreen{display:none;max-width:680px;margin:0 auto;padding:2rem;text-align:center}
.rc{width:140px;height:140px;border-radius:50%;margin:0 auto 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800;border:5px solid var(--saffron);background:radial-gradient(circle,#FF6B3522,transparent)}
.rl{font-size:.8rem;color:var(--muted);font-weight:400;margin-top:.15rem}
.rg{font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.6rem;margin-bottom:.5rem}
.sr{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin:1.25rem 0}
.sb{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.8rem 1.2rem;min-width:100px}
.sv{font-size:1.35rem;font-weight:700}.sl{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.rvl{text-align:left;margin-top:1.5rem}
.rvi{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:.9rem 1.1rem;margin-bottom:.6rem;font-size:.85rem}
.rvi.rc2{border-left:4px solid var(--success)}.rvi.rw{border-left:4px solid var(--error)}
.rvq{font-weight:500;margin-bottom:.35rem;line-height:1.3}
.rva{color:var(--muted);font-size:.8rem}.rva span{font-weight:600}
.rac{color:var(--success)}.raw{color:var(--error)}
.ep{position:fixed;font-size:2.5rem;pointer-events:none;animation:fup 1.1s ease-out forwards;z-index:9999}
@keyframes fup{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100px) scale(1.4)}}
#toastE{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(3rem);background:var(--card);border:1px solid var(--border);padding:.6rem 1.25rem;border-radius:9px;font-size:.85rem;transition:.3s;z-index:1000;pointer-events:none;opacity:0}
#toastE.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:600px){.chapter-grid{grid-template-columns:1fr}.qcard{padding:1.1rem}}
</style>
</head>
<body>
<div id="homeScreen">
  <div class="logo">ଓଡ଼ିଶା GK Mock Tests</div>
  <div class="subtitle" id="homeSub"></div>
  <div class="chapter-grid" id="homeGrid"></div>
</div>
<div id="quizScreen">
  <div class="qhdr">
    <div class="quiz-chapter" id="qct"></div>
    <div class="pt"><span id="ql">Q 1 of 1</span><span class="sc2" id="sl2">Score: 0</span></div>
    <div class="pb-wrap"><div class="pb-fill" id="pf2" style="width:0%"></div></div>
  </div>
  <div class="qcard">
    <div class="qn" id="qn2"></div>
    <div class="qt" id="qt2"></div>
    <div id="qtw2"></div>
    <div class="opts" id="oc2"></div>
    <div class="expl" id="ex2"></div>
  </div>
  <div class="qnav">
    <button class="btn bs" onclick="exitQ()">✕ Exit</button>
    <button class="btn bp" id="nb2" style="display:none" onclick="nq()">Next →</button>
  </div>
</div>
<div id="resultsScreen">
  <div style="font-family:'Tiro Devanagari Sanskrit',serif;font-size:1.3rem;color:var(--saffron);margin-bottom:1rem" id="rcn"></div>
  <div class="rc" id="rc2"><span id="rpc">0%</span><span class="rl">Score</span></div>
  <div class="rg" id="rg2"></div>
  <div class="sr">
    <div class="sb"><div class="sv" id="rtq">0</div><div class="sl">Total</div></div>
    <div class="sb"><div class="sv" id="rco" style="color:var(--success)">0</div><div class="sl">Correct</div></div>
    <div class="sb"><div class="sv" id="rwr" style="color:var(--error)">0</div><div class="sl">Wrong</div></div>
    <div class="sb"><div class="sv" id="rsk" style="color:var(--muted)">0</div><div class="sl">Skipped</div></div>
  </div>
  <div style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem">
    <button class="btn bp" id="rtrybtn">🔄 Retry</button>
    <button class="btn bs" onclick="goHome()">← Chapters</button>
  </div>
  <div class="rvl" id="rvl2"></div>
</div>
<div id="toastE"></div>
<script>
const CH=[{"title":"ANCIENT HISTORY OF ODISHA","questions":[{"text":"What is the pre- historic name of Odisha?","tableLines":[],"options":["Utkala","Kalinga","Kosala","Udra"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"Which literary source mentions about Kalinga and Odra and its sacred river Baitarani and Goddess Viraja?","tableLines":[],"options":["Vayu Purana","Manu Smriti","The Mahabharata","None of the above"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"Which literary source mentioned Odisha as Kalinganagara situated on the West of Gontri river?","tableLines":[],"options":["Brihaspati Smriti","Arthasastra","Ramayana","Avasyaka Nirvukti"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"Which among the following is a Buddhist Literary Source of Odisha's ancient history?","tableLines":[],"options":["Kurudharma Jataka","Avasyaka Niyukti","Brihat Samhita","Harshacharita"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Greek historian Pliny mentions Odisha by which name?","tableLines":[],"options":["Kalinga","Kosala","Toshali","Udra"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Which of the following excavation site is not a part of 'Diamond Triangle' of Odishan archaeology?","tableLines":[],"options":["Khandagiri","Udayagiri","Ratnagiri","Lalitgiri"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Which of the following inscriptions, throws light on the administration of Asoka in Kalinga?","tableLines":[],"options":["Dhauli","Jaugada","Sundergarh","Both (a) and (b)"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"The earliest coins available in Odisha are","tableLines":[],"options":["Punch-marked coins","Puri Kushana coin","Nala coins","Gupta coins"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Which of the following coins suggest that trade and commerce existed in Odisha?","tableLines":[],"options":["Puri-Kushana coins","Nala coins","Punch-marked coins","Gupta coins"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"Which among the following pre historic site in Odisha belongs to Neolithic era?","tableLines":[],"options":["Baripada","Barabati","Udayagiri","All of these"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"The capital of Kalinga according to Jain and Buddhist literature in ancient times was-","tableLines":[],"options":["Toshali","Dantapur","Kalinga Pattnam","Kosala"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"Who were the rulers of Kalinga before the establishment of Maurya dynasty?","tableLines":[],"options":["Rashtrakutas","Matharas","Nandas","Nalas"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"King Asoka became Buddhist after he was horrified with the tyranny of Kalinga War. It was in: [OPSC 2017]","tableLines":[],"options":["258 BC","261 BC","200 BC","327 BC"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"What was the capital of Kalinga after its annexation with Magadha empire?","tableLines":[],"options":["Tosali","Samapa","Sisupalgarh","Dantapura"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Hathigumpha inscription in Udayagiri near Bhubaneswar gives information about which dynasty of ancient Odisha?","tableLines":[],"options":["Chedi dynasty","Ganga dynasty","Satvahana dynasty","None of these"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Which among these is not a principality of Kalinga during the Guptas?","tableLines":[],"options":["Kottura","Erandapalla","Kongoda","Devarashtra"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"Which Mathora king declared himself as Lord of the Kalinga?","tableLines":[],"options":["Visakhavarman","Shaktivarman","Prabhanjanavarman","Umavarman"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"Who among the following transferred his capital from Simhapura to Pishtapura?","tableLines":[],"options":["Umavarman","Vishakavarman","Shaktivarman","None of these"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"Nala dynasty (4-5 century AD) was centered around which modern districts of Odisha?","tableLines":[],"options":["Ganjam and Gajapati","Cuttack and Khordha","Malkangiri and Ganjam","Koraput and Kalahandi"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"The Meghas ruled over which part of Kosala?","tableLines":[],"options":["North Kosala","East Kosala","South Kosala","West Kosala"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"After the downfall of Gupta empire, many regional kingdoms emerged in Odisha from 6-9th century AD. Which is not one among them?","tableLines":[],"options":["The Vigrahas","The Mudgalas","The Nagas","The Mandala states"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"The territory of the Sailodbhava dynasty was known as","tableLines":[],"options":["Kalinga Dynasty","Kalinga Mandala","Kongoda Desh","Kangoda Mandala"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"In which royal dynasty of early medieval Odisha, we find the rule of the queens?","tableLines":[],"options":["Sailodbhava dynasty","Bhauma-Kara dynasty","Somavamsi dynasty","Satavahana dynasty"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"Which among the following Queen built the Gauri temple at Bhubaneswar?","tableLines":[],"options":["Vakula Mahadevi","Gauri Mahadevi","Prithvi Mahadevi","None of these"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"The Bhauma- Kara dynasty in Odisha had commercial relations with which country?","tableLines":[],"options":["Egypt","Ceylon","Indonesia","Rome"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"For the first time Kalinga, Utkala, Kongodo and Kosala were unified by","tableLines":[],"options":["Bhauma-Kara dynasty","Ganga dynasty","Sailodbhava dynasty","Somavamsi dynasty"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"Which ruler of Somavamsi dynasty started the construction of Lingaraj temple?","tableLines":[],"options":["Indraratha","Yayati II","Janmejaya I","Janmejaya II"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"Assertion (A) Kharavela invaded the Satavahana kingdom and captured its territories. Reason (R) Chandravarman declared himself the Lord of Kalinga. Select the correct answers from the codes given below","tableLines":[],"options":["Both A and R are true and R is the correct explanation of A.","Both A and R are true, but R is not the correct explanation of A.","A is true, but R is false.","A is false, but R is true."],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"Match the following.\nKingdoms Regions","tableLines":["A. Parvatadvarkas 1. South Kosala","B. Sarbhapuriyas 2. Ganjam","C. Sailodbhava 3. Kalahandi","D. Bhauma-Kara 4. Jajpur"],"options":["2 4 1 3","4 2 3 1","1 3 2 4","3 1 2 4"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"}]},{"title":"MEDIEVAL HISTORY OF ODISHA","questions":[{"text":"The Gajapatis were a medieval Hindu dynasty that ruled over Kalinga from","tableLines":[],"options":["1334-1441","1434-1467","1534-1541","1434-1541"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"Who among the following initiated Ganga dynasty in Odisha?","tableLines":[],"options":["Raja Rajadeva-I","Anantavarman Chodagangadev","Vajarahasta-V","Kamarnava"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"The kingdom of Odisha reached the zenith of its glory under which dynasty?","tableLines":[],"options":["Ganga dynasty","Bhoi dynasty","Mukundadeva","Mughal"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Which Ganga ruler built the world famous Konark temple?","tableLines":[],"options":["Narasimhadeva I","Bhanudeva IV","Chodagangadeva","Rajarajadeva"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"The great poet Jayadeva flourished during which dynasty in Odisha?","tableLines":[],"options":["Gajapati","Ganga","Bhoi","Karrani"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"Who built the well decorated and well sculptured temple of Konark?","tableLines":[],"options":["Angavimadev-I","Narashimadeva-I","Narashimadeva-II","Narashimadeva-III"],"letters":["A","B","C","D"],"correctIdx":1,"ansLetter":"B"},{"text":"Which of the following Odisha type Nagara style temples are found at Bhubaneswar? [OPSC 2017]\n1. Jagannath temple\n2. Lingaraja temple\n3. Sun temple\n4. Mukteswar temple\n5. Parasurameswara temple\nChoose the answers from the codes below:","tableLines":[],"options":["4 and 5","2 Only","2, 4 and 5","1, 3 and 5"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"What were the provinces known in Odisha during the period of Ganga dynasty?","tableLines":[],"options":["Dauvarika","Panchali","Bhoga","Visayas"],"letters":["A","B","C","D"],"correctIdx":3,"ansLetter":"D"},{"text":"Sri Chaitanya, the famous Vaishnava saint of Bengal, had come to Odisha during the reign of","tableLines":[],"options":["Prataparudra Deva","Kapilendra Deva","Chodaganga Deva","Raja Rajadeva I"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"Which river was chosen as the line of demarcation between the Gajapati Dynasty and Vijayanagara empire in 1513 AD?","tableLines":[],"options":["Godavari","Mahanadi","Krishna","Kaveri"],"letters":["A","B","C","D"],"correctIdx":2,"ansLetter":"C"},{"text":"Quli Qutb Shah invaded Odisha during the reign of which ruler?","tableLines":[],"options":["Prataparudra Deva","Raghuji Bhonsle I","Narasimha Deva","Govind Vidyadhara"],"letters":["A","B","C","D"],"correctIdx":0,"ansLetter":"A"},{"text":"The Ghunta, Mana and Bati terms used in Gajapati Dy function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function buildTbl(tl){
  if(!tl||!tl.length)return'';
  let h='<table class="q-table"><tbody>';
  tl.forEach(line=>{
    if(/^[A-Z][a-z]+\s{2,}[A-Z][a-z]+/.test(line)){const p=line.split(/\s{2,}/);h+='<tr>'+(p.map(x=>'<th>'+escH(x.trim())+'</th>').join(''))+'</tr>';return}
    const m=line.match(/^([A-D]\.\s+\S+.*?)\s{2,}(\d+\.\s+.+)/);
    if(m){h+='<tr><td>'+escH(m[1].trim())+'</td><td>'+escH(m[2].trim())+'</td></tr>';return}
    h+='<tr><td colspan="2">'+escH(line.trim())+'</td></tr>';
  });
  return h+'</tbody></table>';
}
let cc=null,cqi=0,sc=0,ans=[];
let aC=null;
function gA(){if(!aC)aC=new(window.AudioContext||window.webkitAudioContext)();return aC}
function tn(f,d,t,v){try{const c=gA(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.22,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d)}catch(e){}}
function pC(){tn(523,.12,'sine',.2);setTimeout(()=>tn(659,.12,'sine',.2),100);setTimeout(()=>tn(784,.2,'sine',.26),200)}
function pW(){tn(220,.15,'sawtooth',.13);setTimeout(()=>tn(180,.25,'sawtooth',.09),120)}
function pCl(){tn(800,.05,'sine',.06)}
function pop(e,x,y){const el=document.createElement('div');el.className='ep';el.textContent=e;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1200)}
function tst(m){const t=document.getElementById('toastE');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function ss(n){['homeScreen','quizScreen','resultsScreen'].forEach(id=>document.getElementById(id).style.display='none');document.getElementById(n).style.display='block'}
function goHome(){pCl();ss('homeScreen')}
function initHome(){
  const g=document.getElementById('homeGrid');
  document.getElementById('homeSub').textContent=CH.length+' chapters • '+CH.reduce((s,c)=>s+c.questions.length,0)+' questions';
  CH.forEach((ch,i)=>{
    const d=document.createElement('div');d.className='chapter-card';
    d.innerHTML='<div class="ch-num">Chapter '+(i+1)+'</div><div class="ch-name">'+escH(ch.title)+'</div><div class="ch-meta">'+ch.questions.length+' questions</div><div class="ch-badge">▶ Start</div>';
    d.onclick=()=>{pCl();sQ(i)};g.appendChild(d);
  });
}
function sQ(idx){cc=CH[idx];cqi=0;sc=0;ans=[];document.getElementById('qct').textContent=cc.title;ss('quizScreen');rQ()}
function rQ(){
  const q=cc.questions[cqi],tot=cc.questions.length;
  document.getElementById('ql').textContent='Q '+(cqi+1)+' of '+tot;
  document.getElementById('sl2').textContent='Score: '+sc;
  document.getElementById('pf2').style.width=((cqi/tot)*100)+'%';
  document.getElementById('qn2').textContent='Q '+(cqi+1);
  document.getElementById('qt2').innerHTML=q.text.split('\n').map(l=>escH(l)).join('<br>');
  document.getElementById('qtw2').innerHTML=buildTbl(q.tableLines);
  document.getElementById('ex2').style.display='none';
  document.getElementById('nb2').style.display='none';
  const oc=document.getElementById('oc2');oc.innerHTML='';
  const isMT=q.tableLines&&q.tableLines.length>0;
  q.options.forEach((opt,i)=>{
    const d=document.createElement('div');d.className='opt';
    let od=opt;
    if(isMT){const pts=opt.trim().split(/\s+/);const lb=['A','B','C','D'];if(pts.length===4&&pts.every(p=>/^\d+$/.test(p))){od=lb.map((l,k)=>l+'→'+pts[k]).join('  ')}}
    d.innerHTML='<span class="ol">'+q.letters[i]+'</span><span class="ot">'+escH(od)+'</span>';
    d.onclick=(e)=>selA(i,d,e);oc.appendChild(d);
  });
}
function selA(si,el,evt){
  const q=cc.questions[cqi];
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('lk'));
  const ic=si===q.correctIdx;
  ans.push({question:q.text,options:q.options,letters:q.letters,selected:si,correctIdx:q.correctIdx,isCorrect:ic});
  document.querySelectorAll('.opt')[q.correctIdx].classList.add('correct');
  if(!ic){el.classList.add('wrong');pW();pop('❌',evt.clientX,evt.clientY)}
  else{sc++;pC();pop('✅',evt.clientX,evt.clientY)}
  document.getElementById('sl2').textContent='Score: '+sc;
  document.getElementById('nb2').style.display='inline-flex';
  const ex=document.getElementById('ex2');
  ex.textContent='✔ Correct: ('+q.letters[q.correctIdx]+') '+q.options[q.correctIdx];
  ex.style.display='block';
}
function nq(){pCl();cqi++;if(cqi>=cc.questions.length)shRes();else rQ()}
function exitQ(){pCl();if(cqi>0)shRes();else goHome()}
function shRes(){
  const tot=cc.questions.length,cor=ans.filter(a=>a.isCorrect).length,wr=ans.filter(a=>!a.isCorrect).length,sk=tot-ans.length,pct=tot>0?Math.round((cor/tot)*100):0;
  document.getElementById('rcn').textContent=cc.title;
  document.getElementById('rpc').textContent=pct+'%';
  document.getElementById('rtq').textContent=tot;
  document.getElementById('rco').textContent=cor;
  document.getElementById('rwr').textContent=wr;
  document.getElementById('rsk').textContent=sk;
  const gd=pct>=90?['🏆 Excellent!','#FF6B35']:pct>=75?['🥇 Very Good','#FF6B35']:pct>=60?['👍 Good','#F5A623']:pct>=40?['📖 Keep Studying','#94A3B8']:['💪 Keep Practicing','#EF4444'];
  document.getElementById('rg2').textContent=gd[0];document.getElementById('rg2').style.color=gd[1];
  document.getElementById('rc2').style.borderColor=gd[1];
  document.getElementById('rtrybtn').onclick=()=>{pCl();sQ(CH.indexOf(cc))};
  const rvl=document.getElementById('rvl2');
  rvl.innerHTML='<div style="font-weight:700;margin-bottom:.75rem;font-size:.9rem">📋 Answer Review</div>';
  ans.forEach((a,i)=>{
    const d=document.createElement('div');d.className='rvi '+(a.isCorrect?'rc2':'rw');
    const st='('+a.letters[a.selected]+') '+a.options[a.selected];
    const ct='('+a.letters[a.correctIdx]+') '+a.options[a.correctIdx];
    d.innerHTML='<div class="rvq">Q'+(i+1)+'. '+escH(a.question.split('\n')[0])+'</div><div class="rva">Your: <span class="'+(a.isCorrect?'rac':'raw')+'">'+escH(st)+'</span>'+(a.isCorrect?'':'<br>Correct: <span class="rac">'+escH(ct)+'</span>')+'</div>';
    rvl.appendChild(d);
  });
  ss('resultsScreen');
  if(pct>=75){pC();setTimeout(pC,400)}else pW();
}
initHome();
</script>
