<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ଓଡ଼ିଆ GK </title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Basic Reset & Body Styling */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f0f2f5 0%, #e0e6eb 100%); /* Light gradient background */
    color: #3Document33;
    display: flex;
    justify-content: center; /* Center horizontally */
    align-items: center;   /* Center vertically */
    min-height: 100vh;     /* Full viewport height */
    box-sizing: border-box; /* Include padding/border in element's total width/height */
  }

  /* Container for responsiveness and centering */
  .container { 
    background-color: #ffffff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* Soft shadow */
    text-align: center; /* Center text within the container */
    max-width: 90%; /* Max width for responsiveness */
    width: 600px; /* Preferred width */
    box-sizing: border-box;
  }

  /* Heading Styling */
  h1 {
    color: #2c3e50; /* Darker blue-grey for heading */
    margin-bottom: 30px;
    font-size: 2.5em; /* Larger heading */
    font-weight: 600;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
  }

  /* List Styling */
  ul {
    list-style-type: none; /* Remove default bullet points */
    padding: 0;
    margin: 0;
  }

  li {
    margin-bottom: 15px; /* Spacing between list items */
  }

  /* Link Styling */
  a {
    display: block; /* Make the whole area clickable */
    padding: 15px 25px;
    background-color: #007bff; /* Vibrant blue button */
    color: #ffffff; /* White text */
    text-decoration: none; /* No underline */
    border-radius: 8px;
    transition: all 0.3s ease; /* Smooth transition for hover effects */
    font-size: 1.2em;
    font-weight: 400;
    box-shadow: 0 4px 10px rgba(0, 123, 255, 0.2); /* Soft shadow for buttons */
  }

  a:hover {
    background-color: #0056b3; /* Darker blue on hover */
    transform: translateY(-3px); /* Slightly lift button on hover */
    box-shadow: 0 6px 15px rgba(0, 123, 255, 0.3); /* Enhanced shadow on hover */
  }

  a:active {
    background-color: #004085; /* Even darker on click */
    transform: translateY(0); /* Press down effect */
    box-shadow: 0 2px 5px rgba(0, 123, 255, 0.4);
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .container {
      padding: 30px;
      width: 95%; /* Take more width on smaller screens */
    }

    h1 {
      font-size: 2em;
    }

    a {
      font-size: 1.1em;
      padding: 12px 20px;
    }
  }

  @media (max-width: 480px) {
    .container {
      padding: 20px;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 20px;
    }

    a {
      font-size: 1em;
      padding: 10px 15px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1> ଓଡ଼ିଆ GK </h1>

  <ul>
    <li><a href="Content.txt"> Content </a></li>
    <li><a href="biology.txt"> Biology </a></li>
    <li><a href="chemistry.txt"> Chemistry </a></li>
    <li><a href="economics.txt"> Economics </a></li>
    <li><a href="history.txt"> History </a></li>
    <li><a href="physics.txt"> Physics </a></li>
    <li><a href="polity.txt"> Polity </a></li>
    <li><a href="statikgk.txt"> Statik Gk </a></li>
    <li><a href="gktheory.txt"> ଓଡ଼ିଆ GK Theory </a></li>
    </ul>
</div>

</body>
</html>
