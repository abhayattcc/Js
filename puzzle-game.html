<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle Game</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #FFDAB9 0%, #FFB6C1 100%); /* Softer gradient for game page */
    color: #333;
    margin: 0;
  }
  h1 {
      color: #4A4A4A;
      margin-bottom: 20px;
      font-size: 2.5em;
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }
  .puzzle-container {
    display: grid;
    grid-template-columns: repeat(3, 100px); /* Example for 3x3 puzzle */
    grid-template-rows: repeat(3, 100px);
    gap: 5px;
    border: 5px solid #6c5ce7;
    border-radius: 10px;
    background-color: #f0e6fa;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    padding: 5px; /* Add some padding inside the container */
  }
  .puzzle-tile {
    width: 100px;
    height: 100px;
    background-color: #a29bfe;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    border-radius: 5px;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
    user-select: none; /* Prevent text selection on tiles */
  }
  .puzzle-tile.empty {
    background-color: transparent;
    cursor: default;
    box-shadow: none; /* Remove shadow for empty tile */
  }
  .puzzle-tile:hover:not(.empty) {
    background-color: #8172ff;
    transform: scale(1.05);
  }
  .controls {
    margin-top: 30px;
    display: flex;
    gap: 15px;
  }
  .controls button {
    padding: 12px 25px;
    font-size: 1.1em;
    background-color: #6c5ce7;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
  }
  .controls button:hover {
    background-color: #5b4dd4;
    transform: translateY(-2px);
  }
  .controls button:active {
    background-color: #4a3ebf;
    transform: translateY(0);
  }
</style>
</head>
<body>
  <h1>Sliding Tile Puzzle</h1>
  <div id="puzzle-board" class="puzzle-container">
    </div>
  <div class="controls">
    <button id="shuffleButton">Shuffle</button>
    <button onclick="window.location.href='index.html'">🏠</button>
  </div>

  <script>
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    // Function to play a "move" sound
    function playMoveSound() {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'square'; // A punchier sound for a move
      oscillator.frequency.setValueAtTime(220, audioContext.currentTime); // Lower note
      gainNode.gain.setValueAtTime(0.08, audioContext.currentTime); // Volume

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
      oscillator.stop(audioContext.currentTime + 0.1);
    }

    // Function to play a "solved" sound
    function playSolvedSound() {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = 'triangle'; // Smoother sound
      oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
      gainNode.gain.setValueAtTime(0.15, audioContext.currentTime); // Higher volume

      // Create a sequence of notes for a celebratory sound
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      const durations = [0.1, 0.1, 0.1, 0.2];
      let currentTime = audioContext.currentTime;

      notes.forEach((noteFreq, index) => {
        oscillator.frequency.setValueAtTime(noteFreq, currentTime);
        gainNode.gain.setValueAtTime(0.15, currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, currentTime + durations[index]);
        currentTime += durations[index];
      });

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(currentTime); // Stop after all notes play
    }


    const board = document.getElementById('puzzle-board');
    const shuffleButton = document.getElementById('shuffleButton');
    let tiles = [];
    const size = 3; // 3x3 puzzle
    const totalTiles = size * size;
    let emptyIndex;

    function createTiles() {
      board.innerHTML = '';
      tiles = [];
      for (let i = 0; i < totalTiles - 1; i++) {
        tiles.push(i + 1);
      }
      tiles.push(0); // 0 represents the empty space
      emptyIndex = totalTiles - 1; // Initially empty space is at the end

      renderTiles();
    }

    function renderTiles() {
      board.innerHTML = '';
      tiles.forEach((num, index) => {
        const tile = document.createElement('div');
        tile.classList.add('puzzle-tile');
        if (num === 0) {
          tile.classList.add('empty');
        } else {
          tile.textContent = num;
          tile.addEventListener('click', () => moveTile(index));
        }
        board.appendChild(tile);
      });
    }

    function moveTile(clickedIndex) {
      const rowClicked = Math.floor(clickedIndex / size);
      const colClicked = clickedIndex % size;
      const rowEmpty = Math.floor(emptyIndex / size);
      const colEmpty = emptyIndex % size;

      const canMove =
        (Math.abs(rowClicked - rowEmpty) === 1 && colClicked === colEmpty) ||
        (Math.abs(colClicked - colEmpty) === 1 && rowClicked === rowEmpty);

      if (canMove) {
        // Swap tiles
        [tiles[clickedIndex], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[clickedIndex]];
        emptyIndex = clickedIndex;
        renderTiles();
        playMoveSound(); // Play sound on successful move

        if (isSolved()) {
          playSolvedSound(); // Play solved sound
          setTimeout(() => alert('Puzzle Solved!'), 100); // Small delay to let sound start
        }
      }
    }

    function shuffleTiles() {
      for (let i = tiles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        if (tiles[i] === 0) emptyIndex = i;
        if (tiles[j] === 0) emptyIndex = j;
      }
      if (!isSolvable(tiles.filter(t => t !== 0))) { // Ensure solvability for N-puzzle
        shuffleTiles(); // Reshuffle if not solvable
        return;
      }
      renderTiles();
    }

    function isSolved() {
      for (let i = 0; i < totalTiles - 1; i++) {
        if (tiles[i] !== i + 1) {
          return false;
        }
      }
      return tiles[totalTiles - 1] === 0; // Empty tile in last position
    }

    // Solvability check for N-puzzle
    function isSolvable(arr) {
      let inversions = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        for (let j = i + 1; j < arr.length; j++) {
          if (arr[i] > arr[j]) {
            inversions++;
          }
        }
      }
      return inversions % 2 === 0;
    }


    shuffleButton.addEventListener('click', shuffleTiles);

    createTiles(); // Initial setup
  </script>
</body>
</html>
