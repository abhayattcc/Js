<style>
  /* Basic Reset & Body Styling */
  body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    /* More vibrant and dynamic gradient background */
    background: linear-gradient(135deg, #FF9A9E 0%, #FAD0C4 99%, #FAD0C4 100%); /* Warm sunset gradient */
    background-size: 400% 400%; /* For animation */
    animation: gradientAnimation 15s ease infinite; /* Smooth, slow animation */
    color: #333333;
    display: flex;
    justify-content: center; /* Center horizontally */
    align-items: center;   /* Center vertically */
    min-height: 100vh;     /* Full viewport height */
    box-sizing: border-box; /* Include padding/border in element's total width/height */
  }

  /* Gradient animation keyframes */
  @keyframes gradientAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Container for responsiveness and centering */
  .container {
    background-color: rgba(255, 255, 255, 0.95); /* Slightly transparent white for a frosted look */
    padding: 40px;
    border-radius: 18px; /* More rounded corners */
    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.15); /* Stronger, softer shadow */
    text-align: center; /* Center text within the container */
    max-width: 90%; /* Max width for responsiveness */
    width: 600px; /* Preferred width */
    box-sizing: border-box;
    backdrop-filter: blur(5px); /* Frosted glass effect */
    animation: fadeIn 1s ease-out; /* Fade in animation for the container */
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Heading Styling */
  h1 {
    color: #4A4A4A; /* Darker grey for heading, more modern */
    margin-bottom: 30px;
    font-size: 2.8em; /* Larger heading */
    font-weight: 700; /* Bolder */
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1); /* More pronounced text shadow */
    letter-spacing: 1.5px; /* Slightly spaced letters */
  }

  /* List Styling */
  ul {
    list-style-type: none; /* Remove default bullet points */
    padding: 0;
    margin: 0;
  }

  li {
    margin-bottom: 20px; /* More spacing between list items */
  }

  /* Link Styling */
  a {
    display: block; /* Make the whole area clickable */
    padding: 18px 30px; /* More padding for larger buttons */
    background-image: linear-gradient(45deg, #84CEEB 0%, #5DC1B9 100%); /* Bright, inviting gradient */
    color: #ffffff; /* White text */
    text-decoration: none; /* No underline */
    border-radius: 10px; /* More rounded button corners */
    transition: all 0.4s ease; /* Smooth transition for hover effects */
    font-size: 1.3em; /* Larger font for buttons */
    font-weight: 600; /* Bolder button text */
    box-shadow: 0 8px 20px rgba(0, 191, 255, 0.3); /* Softer, more vibrant shadow */
    position: relative;
    overflow: hidden; /* Hide overflow for hover effect */
  }

  a::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.2); /* Light overlay for hover effect */
    transition: all 0.4s ease;
    transform: skewX(-20deg);
  }

  a:hover::before {
    left: 100%;
  }

  a:hover {
    background-image: linear-gradient(45deg, #5DC1B9 0%, #84CEEB 100%); /* Invert gradient on hover */
    transform: translateY(-5px) scale(1.02); /* Slightly lift and scale button on hover */
    box-shadow: 0 12px 25px rgba(0, 191, 255, 0.4); /* Enhanced shadow on hover */
  }

  a:active {
    background-image: linear-gradient(45deg, #70B6DD 0%, #4FA39C 100%); /* Even darker on click */
    transform: translateY(0) scale(1); /* Press down effect */
    box-shadow: 0 4px 10px rgba(0, 191, 255, 0.5);
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .container {
      padding: 30px;
      width: 95%; /* Take more width on smaller screens */
    }

    h1 {
      font-size: 2.2em;
    }

    a {

      padding: 15px 25px;
    }
  }

  @media (max-width: 480px) {
    .container {
      padding: 20px;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 25px;
    }

    a {
      font-size: 1.1em;
      padding: 12px 20px;
    }
  }
</style>

<script>
  // Function to play a simple click sound using Web Audio API
  function playClickSound() {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = 'sine'; // Sine wave for a soft, simple tone
    oscillator.frequency.setValueAtTime(440, audioContext.currentTime); // A4 note
    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime); // Volume

    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);

    oscillator.start();
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3); // Fade out
    oscillator.stop(audioContext.currentTime + 0.3); // Stop after 0.3 seconds
  }

  // Get all anchor elements within the list
  const navLinks = document.querySelectorAll('.container ul li a');

  // Attach click event listener to each link
  navLinks.forEach(link => {
    link.addEventListener('click', function(event) {
      // Prevent default navigation to allow sound to play if needed, then navigate
      // event.preventDefault(); // Uncomment if you want to delay navigation slightly for sound
      playClickSound();

      // If you prevented default, you'd navigate after a short delay:
      // setTimeout(() => {
      //   window.location.href = this.href;
      // }, 300); // Small delay to let sound play
    });
  });
</script>
